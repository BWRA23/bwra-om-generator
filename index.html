<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ════════════════════════════════════════════════════════
// SUPABASE CONFIG (same as CRM)
// ════════════════════════════════════════════════════════
const SB_URL="https://khctptruikafdcxqsvvy.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoY3RwdHJ1aWthZmRjeHFzdnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMjgzNjAsImV4cCI6MjA4ODYwNDM2MH0.McOv-IDQjDYArugi_QhYJoW9fCItMYF6h6AsDcG1h5g";

// Refresh the Supabase session using the stored refresh_token.
// Returns the new access_token on success, or null (caller should force re-login).
async function sbRefresh(){
  const refresh_token=localStorage.getItem("sb_refresh");
  if(!refresh_token)return null;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify({refresh_token})});
    if(!r.ok)return null;
    const d=await r.json();
    if(d.access_token){
      localStorage.setItem("sb_token",d.access_token);
      if(d.refresh_token)localStorage.setItem("sb_refresh",d.refresh_token);
      if(d.user)localStorage.setItem("sb_user",JSON.stringify(d.user));
      return d.access_token;
    }
  }catch(e){/* fall through to null */}
  return null;
}

async function sbFetch(path,opts={},_retried){
  const token=localStorage.getItem("sb_token");
  const headers={"Content-Type":"application/json","apikey":SB_KEY,...(token?{"Authorization":"Bearer "+token}:{}),...(opts.headers||{})};
  const r=await fetch(SB_URL+path,{...opts,headers});
  // Access token expired -> transparently refresh once and retry.
  if(r.status===401&&!_retried){
    const nt=await sbRefresh();
    if(nt)return sbFetch(path,opts,true);
    // Refresh failed: session is truly dead. Clear it so the app drops to the login screen.
    localStorage.removeItem("sb_token");localStorage.removeItem("sb_refresh");localStorage.removeItem("sb_user");
    window.dispatchEvent(new Event("sb-session-expired"));
  }
  if(!r.ok)throw new Error(await r.text());
  const text=await r.text();
  return text?JSON.parse(text):null;
}

async function sbAuth(email,password){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify({email,password})});
  if(!r.ok){const e=await r.json();throw new Error(e.error_description||e.msg||"Login failed")}
  return r.json();
}

// Two-factor: a password alone gives an "aal1" token; the database only opens
// listings to "aal2" (password + authenticator code), the same as the CRM.
function tokenAal(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).aal||"aal1"}catch(e){return null}}
async function sbMfaVerify(token,factorId,code){
  const h={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+token};
  const c=await fetch(SB_URL+"/auth/v1/factors/"+factorId+"/challenge",{method:"POST",headers:h,body:"{}"});
  const cj=await c.json().catch(()=>({}));
  if(!c.ok||!cj.id)throw new Error(cj.msg||cj.error_description||"Could not start 2FA check");
  const v=await fetch(SB_URL+"/auth/v1/factors/"+factorId+"/verify",{method:"POST",headers:h,body:JSON.stringify({challenge_id:cj.id,code})});
  const vj=await v.json().catch(()=>({}));
  if(!v.ok||!vj.access_token)throw new Error(vj.msg||vj.error_description||"Invalid code. Try again.");
  return vj;
}

// ── number helpers ──
function omNum(v){if(v===null||v===undefined||v==="")return 0;var n=Number(String(v).replace(/[$,%\s]/g,""));return isFinite(n)?n:0}
function omHas(v){return v!==null&&v!==undefined&&String(v).trim()!==""&&isFinite(Number(String(v).replace(/[$,%\s]/g,"")))}
function omMoney(n,dec){dec=dec||0;var v=Math.abs(n);var s="$"+v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});return n<0?"("+s+")":s}
function omMoneyNeg(n,dec){return omMoney(-Math.abs(n),dec)}            // expense style: always in parentheses (zero shows $0)
function omMoneyCell(n,dec,neg){if(Math.round(Math.abs(n)*100)===0)return dec?"$0.00":"$0";return neg?omMoneyNeg(n,dec):omMoney(n,dec)}
function omPct(x,dec){if(!isFinite(x))return "—";return (x*100).toFixed(dec===undefined?1:dec)+"%"}
function omPctNum(x){var v=Math.round(x*1000)/10;return (v%1===0?v.toFixed(0):v.toFixed(1))+"%"}
function omInt(n){return Math.round(n).toLocaleString("en-US")}
function omPhone(p){var d=String(p||"").replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.length===10?d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6):String(p||"")}
function omWordNum(n){var w=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];return n>=0&&n<w.length?w[n]:String(n)}
// "2 BED / 1 BATH", "2BR/1BA", "2 bd 1 ba" -> {beds,baths}
function omParseType(t){var s=String(t||"").toLowerCase();var b=s.match(/(\d+(?:\.\d+)?)\s*(?:bd|bed|br|bedroom)/);var ba=s.match(/(\d+(?:\.\d+)?)\s*(?:ba|bath|bathroom)/);if(/studio/.test(s))return{beds:0,baths:ba?Number(ba[1]):1};return{beds:b?Number(b[1]):null,baths:ba?Number(ba[1]):null}}
function omTypeLabel(t){var p=omParseType(t);if(p.beds===null||p.baths===null)return String(t||"");return (p.beds===0?"Studio":p.beds+" BD")+" / "+p.baths+" BA"}

// FINANCIAL MODEL — every number on pages 3, 10, 11, 12 comes from here so they always tie.
// ════════════════════════════════════════════════════════
function omCalc(inp){
  // A unit counts once it has a rent or is marked vacant (the blank starter row does not).
  var rr=(inp.rentRoll||[]).filter(function(u){return u&&(omNum(u.currentRent)>0||omNum(u.modeledRent)>0||omNum(u.proformaRent)>0||/vac/i.test(String(u.status||"")))});
  var units=rr.length||omNum(inp.units);
  var gba=omNum(inp.gbaSf), price=omNum(inp.price);
  var rows=rr.map(function(u){
    var vacant=/vac/i.test(String(u.status||""));
    var actual=vacant?0:omNum(u.currentRent);
    var modeled=omHas(u.modeledRent)?omNum(u.modeledRent):actual;
    var pf=omHas(u.proformaRent)?omNum(u.proformaRent):modeled;
    return{unit:String(u.unit||""),type:omTypeLabel(u.type),rawType:u.type,vacant:vacant,status:vacant?"Vacant":"Occupied",actual:actual,modeled:modeled,proforma:pf,upside:pf-actual};
  });
  var occupied=rows.filter(function(r){return !r.vacant}).length;
  var inPlaceMo=rows.reduce(function(s,r){return s+r.actual},0);
  var schedMo=rows.reduce(function(s,r){return s+r.modeled},0);
  var pfMo=rows.reduce(function(s,r){return s+r.proforma},0);
  var vacPct=omHas(inp.vacancyPct)?omNum(inp.vacancyPct)/100:0.05;
  var other=omNum(inp.otherIncome);
  function opex(gpr){
    var vac=gpr*vacPct, egi=gpr-vac+other;
    var lines=(inp.expenses||[]).filter(function(e){return e&&String(e.label||"").trim()}).map(function(e){
      var a=omNum(e.amount),amt;
      if(e.basis==="pctEGI")amt=egi*a/100;else if(e.basis==="perSF")amt=gba*a;else if(e.basis==="perUnit")amt=units*a;else amt=a;
      amt=Math.round(amt);
      return{label:omExpenseLabel(e),basis:e.basis||"fixed",rate:a,amount:amt};
    });
    var total=lines.reduce(function(s,l){return s+l.amount},0);
    return{gpr:gpr,vacancy:Math.round(vac),egi:Math.round(egi),other:other,lines:lines,total:total,noi:Math.round(egi)-total,ratio:egi?total/Math.round(egi):NaN};
  }
  var cur=opex(schedMo*12), pf=opex(pfMo*12);
  var types={};rows.forEach(function(r){var k=r.type||"Unit";types[k]=(types[k]||0)+1});
  var layouts=Object.keys(types).sort(function(a,b){var pa=omParseType(a),pb=omParseType(b);return (pb.beds||0)-(pa.beds||0)||(pb.baths||0)-(pa.baths||0)}).map(function(k){var p=omParseType(k);var lab=(p.beds===null||p.baths===null)?k:(p.beds===0?"studio":p.beds+" bd")+" "+p.baths+" ba";return{count:types[k],type:k,label:"("+types[k]+") "+lab,beds:p.beds,baths:p.baths}});
  function find(re){var l=cur.lines.filter(function(x){return re.test(x.label)})[0];return l?l.amount:null}
  return{
    rows:rows,units:units,occupied:occupied,occupancy:rows.length?occupied/rows.length:NaN,gba:gba,price:price,siteSf:omNum(inp.siteSf),
    inPlaceMo:inPlaceMo,schedMo:schedMo,pfMo:pfMo,upsideMo:pfMo-inPlaceMo,avgSched:units?schedMo/units:0,
    vacPct:vacPct,cur:cur,pf:pf,layouts:layouts,
    inPlaceCap:(price&&schedMo)?cur.noi/price:NaN,proformaCap:(price&&pfMo)?pf.noi/price:NaN,
    pricePerSf:(price&&gba)?price/gba:NaN,pricePerUnit:(price&&units)?price/units:NaN,
    grmProforma:(price&&pfMo)?price/(pfMo*12):NaN,grmInPlace:(price&&inPlaceMo)?price/(inPlaceMo*12):NaN,
    opexPerUnit:(units&&schedMo)?cur.total/units:NaN,
    insPerSf:(gba&&find(/insur/i)!==null)?find(/insur/i)/gba:NaN,
    rmPerSf:(gba&&find(/repair|maint/i)!==null)?find(/repair|maint/i)/gba:NaN
  };
}
function omExpenseLabel(e){var l=String(e.label||"").trim();if(/\(/.test(l))return l;var a=omNum(e.amount);
  if(e.basis==="pctEGI")return l+" ("+a.toFixed(1)+"% of EGI)";
  if(e.basis==="perSF")return l+" ("+omMoney(a,2)+"/SF)";
  if(e.basis==="perUnit")return l+" ("+omMoney(a)+"/Unit)";return l}

// Summary rows for page 3 (values computed; any override in d.summaryOverrides wins).
function omSummaryRows(d,f){
  var ov=d.summaryOverrides||{};
  function v(key,computed){return (ov[key]!==undefined&&String(ov[key]).trim()!=="")?String(ov[key]):computed}
  var left=[
    {key:"price",label:(d.priceLabel||"BUILDING PRICE"),value:v("price",f.price?omMoney(f.price):"")},
    {key:"ppsf",label:"PRICE PER SF",value:v("ppsf",isFinite(f.pricePerSf)?omMoney(f.pricePerSf,2)+"/sf":"")},
    {key:"income",label:"INCOME",value:v("income",f.schedMo?omMoney(f.schedMo)+"/mo":"")},
    {key:"site",label:"SITE SIZE",value:v("site",f.siteSf?"+/-"+omInt(f.siteSf)+" sf":"")},
    {key:"layouts",label:"LAYOUTS",value:v("layouts",f.layouts.map(function(l){return l.label}).join("\n"))}
  ];
  var right=[
    {key:"units",label:"UNIT COUNT",value:v("units",f.units?String(f.units):"")},
    {key:"gba",label:"GBA",value:v("gba",f.gba?"+/- "+omInt(f.gba)+" sf":"")},
    {key:"occ",label:"OCCUPANCY",value:v("occ",isFinite(f.occupancy)?Math.round(f.occupancy*100)+"%":"")},
    {key:"ipcap",label:"IN PLACE CAP",value:v("ipcap",isFinite(f.inPlaceCap)?(f.inPlaceCap*100).toFixed(1)+"%":"")},
    {key:"pfcap",label:"PRO FORMA CAP",value:v("pfcap",isFinite(f.proformaCap)?(f.proformaCap*100).toFixed(1)+"%":"")}
  ];
  if(d.showPricePerUnit)right.push({key:"ppu",label:"PRICE PER UNIT",value:v("ppu",isFinite(f.pricePerUnit)?omMoney(f.pricePerUnit):"")});
  (d.summaryExtra||[]).forEach(function(x,i){if(x&&!x.hidden&&String(x.label||"").trim()&&String(x.value||"").trim())(i%2===0?left:right).push({key:"x"+i,label:String(x.label).toUpperCase(),value:String(x.value)})});
  var hide=d.summaryHidden||[];function keep(r){return String(r.value).trim()&&hide.indexOf(r.key)<0}
  return{left:left.filter(keep),right:right.filter(keep)};
}

  var facts=[];if(f.gba)facts.push("±"+omInt(f.gba)+" SF");if(p.yearRenovated)facts.push("renovated "+p.yearRenovated);else if(p.yearBuilt)facts.push("built "+p.yearBuilt);
  var where=[p.neighborhood,p.city].filter(Boolean).join(", ");

    s+=vac.map(function(r){var p2=omParseType(r.type);var t=(p2.beds===null||p2.baths===null)?r.type:(p2.beds===0?"studio":p2.beds+"BR/"+p2.baths+"BA");return (vac.length===1?"one ":"")+t+" unit (Unit "+r.unit+") is vacant and modeled at "+omMoney(r.modeled)+"/mo"}).join("; ")+".";}
  return s;
}
function omCap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}

// TEXT FIT helpers (approximate Poppins metrics; keeps long names inside their boxes)

function omFit(text,maxIn,startPt,minPt,em){var n=String(text||"").length||1;var fs=Math.min(startPt,maxIn*72/(n*em));return Math.max(minPt,Math.round(fs*10)/10)}
function omWrapLines(text,widthIn,pt,em){var cpl=Math.max(8,Math.floor(widthIn*72/(pt*em)));return String(text||"").split(/\n/).reduce(function(s,par){return s+Math.max(1,Math.ceil(par.length/cpl))},0)}

function omOfferingSlide(p,d,f){

  var paras=String(d.offeringText||"").replace(/\r/g,"").split(/\n\s*\n|\n/).map(function(t){return t.trim()}).filter(Boolean);
  var fs=13.9;while(fs>9.5){var lines=paras.reduce(function(n,t){return n+omWrapLines(t,4.55,fs,0.5)},0)+(paras.length-1);if(lines*fs*1.44/72<=6.6)break;fs-=0.4}
  var runs=[];paras.forEach(function(t,i){runs.push({text:t,options:{breakLine:true}});if(i<paras.length-1)runs.push({text:" ",options:{breakLine:true}})});
  s.addText(runs,{x:0.25,y:0.84,w:4.55,h:6.75,fontFace:OM_FONT,fontSize:fs,color:OMC.white,align:"justify",valign:"top",margin:0,lineSpacing:fs*1.44});

  var sr=omSummaryRows(d,f);var rowH=0.445,y0=1.13;
  // One font size for every summary line (both columns), and the two columns share the width by how long their lines are.
  function need(rows){return rows.reduce(function(m,r){var lines=String(r.value).split("\n");return Math.max(m,(r.label+": ").length+lines.reduce(function(a,b){return Math.max(a,b.length)},0))},1)}
  var nL=need(sr.left),nR=need(sr.right),gap=0.15,tot=5.33-gap;
  var wL=Math.max(2.3,Math.min(3.2,tot*nL/(nL+nR)));if(!sr.right.length)wL=tot;var wR=tot-wL;
  var fsAll=Math.min(omFit("x".repeat(nL),wL,12.1,8.5,0.7),sr.right.length?omFit("x".repeat(nR),wR,12.1,8.5,0.7):12.1);
  function col(rows,x,w){var y=y0;rows.forEach(function(r){

  ag.slice(0,3).forEach(function(a,i){if(!d.img.agents[i])e.push("Headshot missing for "+a.name+" (Step 2).");if(!String(a.phone||"").trim())e.push("Phone number missing for "+a.name+" (Step 2).")});
  if(!d.img.cover)e.push("Cover photo is missing (Step 3).");
  if(!d.img.hero)e.push("Hero photo (page 2) is missing (Step 3).");
  if(!d.img.map)e.push("Map is missing (Step 3): click “Generate map from address”.");
  if(!d.img.divider)e.push("Financial Overview photo is missing (Step 3).");
  if(!(d.img.gridPages||[]).length)e.push("Add property photos for the photo pages (Step 3).");
  var ow=String(d.offeringText||"").trim().split(/\s+/).filter(Boolean).length;if(!ow)e.push("Offering description is empty (Step 4).");else if(ow<120)w.push("The offering text is "+ow+" words; about 170\u2013230 fills the panel like the reference.");
  if(!f.rows.length)e.push("Rent roll is empty (Step 6).");
  ((d.finInput||{}).rentRoll||[]).forEach(function(u){if(u&&(String(u.unit||"").trim()||String(u.type||"").trim())&&!(omNum(u.currentRent)>0||omNum(u.modeledRent)>0||omNum(u.proformaRent)>0||/vac/i.test(String(u.status||""))))e.push("Unit "+(u.unit||"?")+" has no rent (Step 6) \u2014 enter it or remove the row.")});
  f.rows.forEach(function(r){if(!r.modeled)e.push("Unit "+(r.unit||"?")+" has no rent (Step 6).");var pt=omParseType(r.type);if(pt.beds===null||pt.baths===null)w.push("Unit "+(r.unit||"?")+" type “"+(r.rawType||"")+"” isn’t in “2 BD / 1 BA” form.")});
  if(!f.cur.lines.length)e.push("Add operating expenses (Step 6).");
  if(d.includeAerial&&!d.img.aerial)e.push("Aerial slide is on but no aerial image was added (Step 3).");
  if(d.includeFloodMap&&!d.img.flood)e.push("Flood map slide is on but no flood map image was added (Step 3).");
  var texts=[P.street,P.cityLine,P.unitDescription,d.offeringText,d.rentRollIntro,d.summaryNote].concat(ag.map(function(a){return a.name+" "+a.title+" "+a.email}));
  texts.forEach(function(t){if(/\[|\]|\bTBD\b|\binsert\b|lorem ipsum|placeholder/i.test(String(t||"")))e.push("Placeholder text found: “"+String(t).slice(0,60)+"”.")});
  if(f.units&&omNum(d.unitsHint)&&omNum(d.unitsHint)!==f.units)w.push("CRM lists "+d.unitsHint+" units but the rent roll has "+f.units+".");
  return{errors:e,warnings:w};
}

function generateFullOM(d){
  var f=omCalc(d.finInput||{});
  var p=new PptxGenJS();
  p.defineLayout({name:"LETTER_LANDSCAPE",width:OM_PW,height:OM_PH});p.layout="LETTER_LANDSCAPE";
  p.author="Bridgewater Realty Advisors";p.company="Bridgewater Realty Advisors";
  p.title=((d.property&&d.property.street)||"Property")+" - Offering Memorandum";
  omCoverSlide(p,d);
  omHeroSlide(p,d);
  if(d.includeAerial&&d.img.aerial)omFullBleedTabSlide(p,d,d.img.aerial,"AERIAL VIEW");
  omOfferingSlide(p,d,f);
  if(d.includeFloodMap&&d.img.flood)omFullBleedTabSlide(p,d,d.img.flood,"FLOOD MAP");
  omPhotoPages(p,d);
  omDividerSlide(p,d);
  omCurrentRentRollSlides(p,d,f);
  omOpexSlide(p,d,f);
  omProformaSlide(p,d,f);
  if(d.includeCashFlow)omCashFlowSlide(p,d);
  omContactSlide(p,d);
  return p;
}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[mfa,setMfa]=useState(null);const[code,setCode]=useState("");const[noFactor,setNoFactor]=useState(false);
  const store=r=>{localStorage.setItem("sb_token",r.access_token);if(r.refresh_token)localStorage.setItem("sb_refresh",r.refresh_token);localStorage.setItem("sb_user",JSON.stringify(r.user));};
  const handleLogin=async()=>{setErr("");setLoading(true);try{const r=await sbAuth(email,pass);
    if(tokenAal(r.access_token)==="aal2"){store(r);onLogin(r.user);return;}
    const f=((r.user&&r.user.factors)||[]).find(x=>x.factor_type==="totp"&&x.status==="verified");
    if(!f){setNoFactor(true);return;}
    setMfa({token:r.access_token,factorId:f.id});setCode("");
  }catch(e){setErr(e.message)}finally{setLoading(false)}};
  const handleCode=async()=>{if(code.length!==6||!mfa)return;setErr("");setLoading(true);try{const r=await sbMfaVerify(mfa.token,mfa.factorId,code);store(r);onLogin(r.user)}catch(e){setErr(e.message);setCode("")}finally{setLoading(false)}};
  const back=()=>{setMfa(null);setNoFactor(false);setErr("");setCode("");setPass("")};
  if(noFactor)return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>2FA isn't set up for this account yet. Sign in to the CRM once to set it up, then come back here.</p>
    <a className="btn-red" style={{display:"block",width:"100%",textDecoration:"none",marginBottom:10,boxSizing:"border-box"}} href="https://crm.bridgewater.realty">Open the CRM</a>
    <button className="btn-dark" style={{width:"100%"}} onClick={back}>Back</button>
  </div></div>;
  if(mfa)return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>Enter the 6-digit code from your authenticator app (the same one you use for the CRM).</p>
    <div className="field"><input autoFocus inputMode="numeric" autoComplete="one-time-code" placeholder="000000" value={code} onChange={e=>setCode(e.target.value.replace(/[^0-9]/g,"").slice(0,6))} onKeyDown={e=>e.key==="Enter"&&handleCode()} style={{textAlign:"center",letterSpacing:"0.3em",fontSize:20}}/></div>
    {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}
    <button className="btn-red" style={{width:"100%",marginBottom:10}} onClick={handleCode} disabled={loading||code.length!==6}>{loading?<span className="spinner"/>:"Verify"}</button>
    <button className="btn-dark" style={{width:"100%"}} onClick={back}>Back</button>
  </div></div>;
  return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>OM Generator — Sign In</p>
    <div className="field"><input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
    <div className="field"><input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()}/></div>
    {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}

// Cover-crop an image to a box aspect (inches) and re-encode as JPEG. Keeps photos undistorted
// and the PPTX small. vBias: 0 = keep top, 0.5 = center (headshots use a slight top bias).
async function cropToBox(src,wIn,hIn,maxPx,vBias){
  if(!src)return null;const im=await loadImg(src);const ar=wIn/hIn;let sw=im.naturalWidth,sh=im.naturalHeight,sx=0,sy=0;
  if(sw/sh>ar){const nw=Math.max(1,Math.round(sh*ar));sx=Math.round((sw-nw)/2);sw=nw}else{const nh=Math.max(1,Math.round(sw/ar));sy=Math.round((sh-nh)*(vBias===undefined?0.5:vBias));sh=nh}
  const ow=Math.max(1,Math.min(maxPx||1800,sw)),oh=Math.max(1,Math.round(ow/ar));const c=document.createElement("canvas");c.width=ow;c.height=oh;
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(im,sx,sy,sw,sh,0,0,ow,oh);return c.toDataURL("image/jpeg",0.86);

// ── iPhone photos (HEIC/HEIF) -> JPG ──
// Chrome can't decode HEIC, so iPhone photos are converted to JPG the moment they're added.
// The converter (libheif compiled to WebAssembly, ~3 MB) only loads the first time a HEIC shows up.
const HEIC_SRC="https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js";
const HEIC_SRI="sha384-cVm8gaWQ5+URpoh6ACKXpm8TuyoHkfIDDBkxvDoUdIZ18w8nV5en0lVQvWMwO/6S";
let __heicLoading=null;
function loadHeicTo(){if(window.HeicTo)return Promise.resolve(window.HeicTo);if(__heicLoading)return __heicLoading;
  __heicLoading=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=HEIC_SRC;sc.integrity=HEIC_SRI;sc.crossOrigin="anonymous";
    sc.onload=()=>window.HeicTo?res(window.HeicTo):rej(new Error("The iPhone photo converter didn't start"));
    sc.onerror=()=>{__heicLoading=null;sc.remove();rej(new Error("Couldn't load the iPhone photo converter (check your connection)"))};document.head.appendChild(sc)});
  return __heicLoading}
function isHeicFile(f){return !!f&&(/hei[cf]/i.test(f.type||"")||/\.(heic|heif)$/i.test(f.name||""))}
function heicStatus(text){try{window.dispatchEvent(new CustomEvent("heic-status",{detail:text||""}))}catch(e){}}
// One conversion at a time (the converter shares a single worker); the status bar stays up until the last job ends.
let __heicChain=Promise.resolve();let __heicActive=0;
function heicJob(msg,fn){__heicActive++;const p=__heicChain.then(()=>{heicStatus(msg);return fn()});__heicChain=p.catch(()=>{});return p.finally(()=>{__heicActive--;if(!__heicActive)heicStatus("")})}
// Some ".heic" files are really JPEG/PNG (re-saved by an app); those just need relabeling, not converting.
async function sniffImageType(blob){try{const b=new Uint8Array(await blob.slice(0,12).arrayBuffer());if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF)return"image/jpeg";if(b[0]===0x89&&b[1]===0x50&&b[2]===0x4E&&b[3]===0x47)return"image/png";if(b[0]===0x52&&b[1]===0x49&&b[2]===0x46&&b[3]===0x46&&b[8]===0x57&&b[9]===0x45)return"image/webp"}catch(e){}return""}

  return heicJob(msg||"Converting iPhone photo to JPG…",()=>withTimeout((async()=>{const H=await loadHeicTo();const out=await H({blob,type:"image/jpeg",quality:0.9});if(!out||!out.size)throw new Error("empty result");return out})(),90000))}
function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error("timed out")),ms)})]).finally(()=>clearTimeout(t))}
// Replace every HEIC in a list with a JPG File of the same name. Files that fail stay as they were and are listed in `failed`.
async function convertHeicFiles(list){
  const arr=Array.from(list||[]);const total=arr.filter(isHeicFile).length;if(!total)return{files:arr,failed:[],converted:0};
  const files=[];const failed=[];let n=0;
  for(const f of arr){
    if(!isHeicFile(f)){files.push(f);continue}
    n++;
    try{const out=await heicBlobToJpeg(f,"Converting iPhone photo"+(total>1?"s "+n+" of "+total:"")+" to JPG…");const ext=out.type==="image/png"?".png":out.type==="image/webp"?".webp":".jpg";
      files.push(new window.File([out],String(f.name||"photo").replace(/\.(heic|heif)$/i,"")+ext,{type:out.type||"image/jpeg",lastModified:f.lastModified||Date.now()}))}
    catch(e){console.warn("HEIC convert failed:",f.name,e);failed.push(f.name);files.push(f)}}

const AF_ABBR={str:"street",ave:"avenue",av:"avenue",blvd:"boulevard",dr:"drive",rd:"road",ln:"lane",ct:"court",pl:"place",pkwy:"parkway",hwy:"highway",cir:"circle",ter:"terrace",sq:"square",hts:"heights",mt:"mount",ft:"fort"};

// "1039-1041 N. Marais St" -> {nums:{1039,1040,1041}, name:"marais", type:"street"}
function addrParts(a){
  const raw=String(a||"").toLowerCase().replace(/\b(apt|apartment|unit|ste|suite|#)\s*[a-z0-9-]+\s*$/,"").replace(/[.#,]/g," ").trim();const m=raw.match(/^(\d+)(?:\s*-\s*(\d+))?[a-z]?\s+(.*)$/);if(!m)return null;
  const lo=+m[1];let hi=m[2]?+m[2]:lo;if(m[2]&&hi<lo&&m[2].length<m[1].length)hi=+(m[1].slice(0,m[1].length-m[2].length)+m[2]);/* "1039-41" = 1039 to 1041 */const nums=new Set();if(hi>=lo&&hi-lo<=40)for(let k=lo;k<=hi;k++)nums.add(k);else nums.add(lo);
  let t=m[3].replace(/[^a-z0-9 ]+/g," ").split(/\s+/).filter(Boolean);
  const FULL={n:"north",s:"south",e:"east",w:"west"};let tailDir=null;
  if(t.length>2&&AF_DIRS.has(t[t.length-1])){tailDir=t.pop()[0]}/* "123 Main St N" */
  t=t.map((x,i)=>x==="st"?(i===t.length-1?"street":"saint"):x==="ste"&&i<t.length-1?"sainte":(FULL[x]||AF_ABBR[x]||x));
  let type=null;if(t.length>1&&AF_TYPES.has(t[t.length-1]))type=t.pop();
  const dirs=t.filter(x=>AF_DIRS.has(x)).map(x=>x[0]);const noDir=t.filter(x=>!AF_DIRS.has(x));let dir=tailDir;if(noDir.length){t=noDir;dir=dirs[0]||tailDir||null}

  async function waitForSave(){for(let k=0;k<300&&savingRef.current;k++)await new Promise(r=>setTimeout(r,150))}
  async function saveDraft(opts){
    opts=opts||{};
    if(loadingRef.current){if(!opts.silent)showToast("Still loading this OM — try again in a moment");return null}
    if(savingRef.current){if(!opts.wait)return omIdRef.current;await waitForSave()}

      const data=collectData(urlFor,opts.mapOverride);
      const cur=omRowRef.current;const guard=(!opts.force&&cur&&cur.id===id&&cur.updated_at)?"&updated_at=eq."+encodeURIComponent(cur.updated_at):"";
      const r2=await sbFetch("/rest/v1/oms?id=eq."+id+guard,{method:"PATCH",headers:{"Prefer":"return=representation"},body:JSON.stringify(Object.assign({},meta,{data,thumb_url:urlFor(coverPhoto)||urlFor(heroPhoto)||null}))});

      setLastSavedFp(fpAtStart);setLastSavedAt(new Date().toISOString());fetchOMs();
      if(!opts.silent)showToast("Progress saved");
      return id;
    }catch(e){const m=e.message||String(e);if(live())setSaveError(m);if(!opts.silent)showToast("Save failed: "+m.slice(0,120));return null}

    if(pl.from==="slot"){const v=slotGet(pl.slot);if(!v)return;const n=[...gridPhotos];
      if(j>=n.length){if(n.length>=MAX_GRID){showToast("The photo pages are full ("+MAX_GRID+")");return}n.push(v);slotPut(pl.slot,null)}
      else{const old=n[j];n[j]=v;slotPut(pl.slot,old)}
      setGridPhotos(n);return}
    if(pl.from==="crm"){if(gridPhotos.length>=MAX_GRID){showToast("The photo pages are full ("+MAX_GRID+")");return}
      const anchor=j<gridPhotos.length?gridPhotos[j]:null;   // insert before this photo, wherever it is by the time the download lands
      loadCrmForDrop(pl,d=>{const cur=liveRef.current.grid;if(cur.length>=MAX_GRID){showToast("The photo pages are full ("+MAX_GRID+")");return}
        const at=anchor?cur.indexOf(anchor):cur.length;const n=[...cur];n.splice(at<0?n.length:at,0,d);setGridPhotos(n)})}
  }
  function dropOnSlot(slot,pl){
    if(pl.from==="grid"){const v=gridPhotos[pl.i];if(!v)return;const old=slotGet(slot);const n=[...gridPhotos];if(old)n[pl.i]=old;else n.splice(pl.i,1);setGridPhotos(n);slotPut(slot,v);return}
    if(pl.from==="slot"){if(pl.slot===slot)return;const a=slotGet(pl.slot),b=slotGet(slot);slotPut(slot,a);slotPut(pl.slot,b);return}
    if(pl.from==="crm"){const before=slotGet(slot);loadCrmForDrop(pl,d=>{if(liveRef.current[slot]!==before){showToast("That slot changed while the photo was loading — drop it again");return}slotPut(slot,d)})}
  }
  function slotDnd(slot){return Object.assign(dropTarget("slot:"+slot,pl=>dropOnSlot(slot,pl)),{onDragStart:dragFrom({from:"slot",slot},"slot:"+slot,slotGet(slot))})}
  function moveGrid(i,dir){setGridPhotos(prev=>{const n=[...prev];const j=i+dir;if(j<0||j>=n.length)return prev;[n[i],n[j]]=[n[j],n[i]];return n})}

  // ── Financial import from files / notes (om-ai "extract_financials") ──
  async function readFinancials(){
    setFinLoading(true);setFinError("");setFinResult(null);
    try{
      const files=[];let text=finNotes||"";let bytes=0;
      for(const f of finFiles){
        const n=f.name.toLowerCase();
        if(/\.(xlsx|xlsm|xls|ods)$/.test(n))text+="\n\nFile: "+f.name+"\n"+await spreadsheetToText(f);
        else if(/\.(csv|tsv|txt|md)$/.test(n)||/^text\//.test(f.type))text+="\n\nFile: "+f.name+"\n"+await fileToText(f);
        else if(f.type==="application/pdf"||/^image\/(png|jpeg|gif|webp)$/.test(f.type)){const du=await fileToDataURL(f);const data=du.split(",")[1];bytes+=data.length;files.push({name:f.name,mediaType:f.type,data})}
        else throw new Error("Can't read "+f.name+" — use PDF, Excel, CSV, a photo/screenshot, or paste the numbers.");
      }
      if(bytes>18e6)throw new Error("Those files are too large together (over ~13 MB). Upload fewer pages or screenshots.");
      if(!files.length&&!text.trim())throw new Error("Upload a file or paste notes first.");
      const r=await sbInvoke("om-ai",{action:"extract_financials",files,text,context:{address:street,units:unitsHint||null,askingPrice:askingPrice||null,gbaSf:gbaSf||null}});
      setFinResult(r.data||{});
    }catch(e){setFinError(e.message)}
    setFinLoading(false);
  }
  // Extraction result (om-ai extract_financials) -> form. Tables are replaced when the documents have them;
  // property facts only fill fields that are still empty, so nothing typed by hand is overwritten.
  function applyExtraction(x){
    x=x||{};
    const hasRR=Array.isArray(x.rentRoll)&&x.rentRoll.length>0;
    if(hasRR)setRentRoll(x.rentRoll.map((u,i)=>{const vac=/vac/i.test(u.status||"")||!omNum(u.currentRent);return{unit:String(u.unit||i+1),type:omTypeLabel(u.type||""),status:vac?"Vacant":"Occupied",currentRent:vac?"":String(omNum(u.currentRent)),modeledRent:omHas(u.modeledRent)?String(omNum(u.modeledRent)):(vac?"":String(omNum(u.currentRent))),proformaRent:omHas(u.proformaRent)?String(omNum(u.proformaRent)):""}}));
    if(omHas(x.vacancyPct))setVacancyPct(String(omNum(x.vacancyPct)));
    if(omHas(x.otherIncome))setOtherIncome(String(omNum(x.otherIncome)));
    if(Array.isArray(x.expenses)&&x.expenses.length){
      const got=x.expenses.map(e=>({label:e.label||"",basis:["fixed","pctEGI","perSF","perUnit"].includes(e.basis)?e.basis:"fixed",amount:omHas(e.amount)?String(omNum(e.amount)):""}));
      // Documents often list only taxes/insurance/utilities. Keep the standard underwriting lines
      // (repairs & maintenance, management fee) the seller's papers leave out, so NOI isn't overstated.
      const isRM=l=>/repair|r\s*&\s*m\b|\bmaint/i.test(l)&&!/lawn|pool|landscap|grounds|pest/i.test(l),isMgmt=l=>/manag|mgmt|mgt\b/i.test(l)&&!/waste|trash|garbage/i.test(l);
      const keep=[isRM,isMgmt].map(fn=>({test:fn})).map(re=>got.some(e=>re.test(e.label))?null:(expenses.find(e=>re.test(e.label||""))||DEFAULT_EXPENSES().find(e=>re.test(e.label)))).filter(Boolean);
      setExpenses(got.concat(keep.map(e=>Object.assign({},e))));
    }
    if(x.marketRentSupport&&Array.isArray(x.marketRentSupport.rows)&&x.marketRentSupport.rows.length)setMarket({source:x.marketRentSupport.source||"",rows:x.marketRentSupport.rows.map(r=>({unitType:r.unitType||"",sample:r.sample??"",p25:r.p25??"",median:r.median??"",avg:r.avg??"",p75:r.p75??"",applied:r.applied??""}))});
    if(x.rentRollDate)setRentRollDate(String(x.rentRollDate));
    const P=x.property||{};const str=v=>v===null||v===undefined?"":String(v).trim();
    const freshAddr=!street.trim();
    if(str(P.street)&&freshAddr)setStreet(expandStreet(str(P.street)));
    if(str(P.street)&&!propertyName.trim())setPropertyName(expandStreet(str(P.street)));
    if(str(P.city)&&!city.trim())setCity(str(P.city));
    if(/^[A-Za-z]{2}$/.test(str(P.state))&&freshAddr)setStateAbbr(str(P.state).toUpperCase());
    if(str(P.zip)&&!zip)setZip(str(P.zip).replace(/[^0-9-]/g,"").slice(0,10));
    if(str(P.neighborhood)&&!neighborhood.trim())setNeighborhood(str(P.neighborhood));
    const nUnits=hasRR?x.rentRoll.length:omNum(P.units);
    if(!unitDescription.trim()){if(str(P.unitDescription))setUnitDescription(str(P.unitDescription));else if(nUnits)setUnitDescription(nUnits+"-unit "+(/mixed/i.test(str(P.propertyType))?"Mixed-Use Building":/commercial/i.test(str(P.propertyType))?"Commercial Building":/single/i.test(str(P.propertyType))?"Single Family Home":"Apartment Complex"))}
    if(omHas(P.askingPrice)&&!omHas(askingPrice))setAskingPrice(String(omNum(P.askingPrice)));
    if(omHas(P.gbaSf)&&!omHas(gbaSf))setGbaSf(String(omNum(P.gbaSf)));
    if(omHas(P.siteSf)&&!omHas(siteSf))setSiteSf(String(omNum(P.siteSf)));
    if(str(P.yearBuilt)&&!yearBuilt)setYearBuilt(str(P.yearBuilt).replace(/\D/g,"").slice(0,4));
    if(str(P.yearRenovated)&&!yearRenovated)setYearRenovated(str(P.yearRenovated).replace(/\D/g,"").slice(0,4));
    if(str(P.lotDescription)&&!lotDescription.trim())setLotDescription(str(P.lotDescription));
    if(str(P.buildingStyle)&&!styleWord.trim())setStyleWord(str(P.buildingStyle));
    if(str(P.floodZone)&&!summaryExtra.some(r=>/flood/i.test(r.label||"")))setSummaryExtra(prev=>prev.concat([{label:"FLOOD ZONE",value:str(P.floodZone)}]));
    if(!hasRR&&omHas(P.units)&&!unitsHint)setUnitsHint(String(omNum(P.units)));
  }
  function finSnapshot(){return{rentRoll,vacancyPct,otherIncome,expenses,market,rentRollDate,askingPrice,gbaSf,siteSf,yearBuilt,yearRenovated,neighborhood}}

  // ctx {city, zip}: when both sides know the city (or ZIP) they must agree, so "123 Main St" in Houma never links to Baton Rouge's.
  async function findCrmMatch(st,ctx){
    let rows=null;try{rows=await sbFetch("/rest/v1/rpc/brokerage_listings",{method:"POST",body:"{}"})}catch(e){rows=null}
    if(!Array.isArray(rows))rows=crmListings;
    const myCity=cityKey(ctx&&ctx.city),myZip=String((ctx&&ctx.zip)||"").slice(0,5);
    const placeOk=l=>{const lc=cityKey(l.city),lz=String(l.zip||"").slice(0,5)||((String(l.city||"").match(/\b\d{5}\b/)||[])[0]||"");
      if(myZip&&lz)return myZip===lz;if(myCity&&lc&&myCity!==lc)return false;return true};
    const hits=rows.filter(l=>(addrMatches(l.address,st)||addrMatches(l.name,st))&&placeOk(l));
    hits.sort((a,b)=>(/closed|dead|withdrawn|expired/i.test(a.status||"")?1:0)-(/closed|dead|withdrawn|expired/i.test(b.status||"")?1:0));
    return hits[0]||null;
  }
  function linkFromMatch(m){const l=crmListings.find(x=>x.legacy_id===m.legacy_id);setSelectedListingId(l?l.id:"");setImportedLegacyId(m.legacy_id);fetchCrmPhotos(m.legacy_id)}
  async function runAutofill(){
    if(afRunning)return;
    if(conflict){showToast("Sort out the “changed elsewhere” banner first");return}
    if(loadingRef.current){showToast("Still loading this OM — try again in a moment");return}
    const files=afFiles.slice();const userNotes=afNotes.trim();
    if(!files.length&&!userNotes){setAfError("Add photos, documents or notes first.");return}
    const token=sessionRef.current;const live=()=>sessionRef.current===token;
    const imgs=files.filter(afIsImage);const others=files.filter(f=>!afIsImage(f));
    const docs=others.filter(afIsReadableDoc);const unreadable=others.filter(f=>!afIsReadableDoc(f));
    const photoFiles=imgs.filter(f=>!AF_DOC_NAME.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    const docImgs=imgs.filter(f=>AF_DOC_NAME.test(f.name));
    const notes=[];if(unreadable.length)notes.push("Couldn't read "+unreadable.map(f=>f.name).join(", ")+" (use PDF, Excel, CSV or a photo). They'll still be copied to the CRM.");
    setAfRunning(true);setAfError("");setAfOut(null);
    setAfSteps([{key:"photos",label:"Sort the photos into the slides"},{key:"docs",label:"Read the documents and notes"},{key:"fill",label:"Fill in the form"},{key:"crm",label:"Find the CRM listing"},
      {key:"map",label:"Pull the map"},{key:"ai",label:"Write the offering description"},{key:"save",label:"Save the draft"}].map(x=>Object.assign(x,{state:"wait",note:""})));
    try{
      // 1. Photos
      let ph=[];const reroute=[];let clsOk=false;
      if(photoFiles.length){afStep("photos","run","Reading "+photoFiles.length+" photo"+(photoFiles.length>1?"s":"")+"…");
        for(const f of photoFiles){
          if(afIsHeic(f)){notes.push(f.name+" couldn't be converted from iPhone format, so it's left out of the OM (it's still copied to the CRM). Try exporting it as a JPG.");continue}
          try{const d=await shrinkImage(await fileToDataURL(f));await loadImg(d);ph.push({i:ph.length,file:f,name:f.name,data:d})}catch(e){notes.push("Couldn't read the photo "+f.name)}
          if(!live())return}
        let cls=null;const nCls=Math.min(ph.length,40);
        if(nCls){afStep("photos","run","Picking the cover, page 2 and divider shots…");
          try{const payload=[];for(let k=0;k<nCls;k++)payload.push({i:k,name:ph[k].name,mediaType:"image/jpeg",data:await makeThumb(ph[k].data,640)});
            const r=await sbInvoke("om-ai",{action:"classify_photos",photos:payload});cls=r.data||null;clsOk=!!(cls&&Array.isArray(cls.photos)&&cls.photos.length)}
          catch(e){notes.push("Photo sorting didn't work ("+e.message+"), so photos went in file-name order. Check the cover, page 2 and divider on Step 3.")}}
        if(!live())return;
        const kinds={},qual={};((cls&&cls.photos)||[]).forEach(p=>{kinds[Number(p.i)]=String(p.kind||"other");qual[Number(p.i)]=omNum(p.quality)});
        ph.forEach(p=>{p.kind=kinds[p.i]||(cls?(p.i<nCls?"other":"unsorted"):(p.i<3?"exterior_front":"unsorted"));p.q=qual[p.i]||0});
        ph.filter(p=>p.kind==="document").forEach(p=>reroute.push(p));ph=ph.filter(p=>p.kind!=="document");
        const isExt=p=>/^exterior/.test(p.kind);const used=new Set();
        const best=fn=>ph.filter(p=>fn(p)&&!used.has(p)).sort((a,b)=>b.q-a.q)[0]||null;
        const pick=(pref,fn)=>{let p=(pref!==null&&pref!==undefined)?ph.find(x=>x.i===Number(pref)):null;if(p&&(!isExt(p)||used.has(p)))p=null;if(!p)p=best(fn)||best(isExt);if(p)used.add(p);return p};
        const coverP=pick(cls&&cls.cover,p=>p.kind==="exterior_front");
        const heroP=pick(cls&&cls.hero,p=>p.kind==="exterior_front"||p.kind==="exterior_side");
        const divP=pick(cls&&cls.divider,p=>p.kind==="exterior_rear"||p.kind==="exterior_side");
        const aerialP=best(p=>p.kind==="aerial");if(aerialP)used.add(aerialP);
        const floodP=best(p=>p.kind==="map"&&/flood/i.test(p.name));if(floodP)used.add(floodP);
        const rank={interior:0,amenity:1,unsorted:2,exterior_front:3,exterior_side:3,exterior_rear:3,aerial:4,other:5};
        const pool=ph.filter(p=>!used.has(p)&&rank[p.kind]!==undefined).sort((a,b)=>(rank[a.kind]-rank[b.kind])||(a.i-b.i));
        const placed=[];
        if(coverP&&!coverPhoto){setCoverPhoto(coverP.data);placed.push("cover")}
        if(heroP&&!heroPhoto){setHeroPhoto(heroP.data);placed.push("page 2")}
        if(divP&&!dividerPhoto){setDividerPhoto(divP.data);placed.push("divider")}
        if(aerialP&&!aerialPhoto){setAerialPhoto(aerialP.data);setIncludeAerial(true);placed.push("aerial page")}
        if(floodP&&!floodMapPhoto){setFloodMapPhoto(floodP.data);setIncludeFloodMap(true);placed.push("flood map page")}
        const room=Math.max(0,MAX_GRID-gridPhotos.length);const add=pool.slice(0,room);
        if(add.length){setGridPhotos(prev=>prev.concat(add.map(p=>p.data)).slice(0,MAX_GRID));placed.push(add.length+" on the photo pages")}
        if(pool.length>room)notes.push((pool.length-room)+" photo"+(pool.length-room>1?"s":"")+" didn't fit the 5 photo pages (they're still copied to the CRM).");
        if(!coverP)notes.push("No exterior shot was found for the cover. Add one on Step 3.");
        afStep("photos","done",placed.length?"Placed: "+placed.join(", "):"Photo slots were already filled");
      } else afStep("photos","skip","No photos uploaded");
      // 2. Documents + notes
      const bin=[];let text=userNotes?"Agent notes:\n"+userNotes:"";let bytes=0;const skipped=[];
      const pushBin=(name,mediaType,data)=>{if(bin.length>=6||bytes+data.length>18e6){skipped.push(name);return}bytes+=data.length;bin.push({name,mediaType,data})};
      for(const f of docs){const n=f.name.toLowerCase();
        try{if(/\.(xlsx|xlsm|xls|ods)$/.test(n))text+="\n\nFile: "+f.name+"\n"+(await spreadsheetToText(f)).slice(0,30000);
          else if(/\.(csv|tsv|txt|md)$/.test(n)||/^text\//.test(f.type||""))text+="\n\nFile: "+f.name+"\n"+(await fileToText(f)).slice(0,30000);
          else pushBin(f.name,"application/pdf",(await fileToDataURL(f)).split(",")[1])}
        catch(e){notes.push("Couldn't read "+f.name+": "+e.message)}
        if(!live())return}
      for(const f of docImgs){if(afIsHeic(f)){notes.push(f.name+" couldn't be converted from iPhone format. Export it as a JPG or PDF so it can be read.");continue}
        try{const d=await shrinkImage(await fileToDataURL(f));const mt=dataUrlType(d);if(/^image\/(png|jpeg|gif|webp)$/.test(mt))pushBin(f.name,mt,d.split(",")[1]);else notes.push("Couldn't read "+f.name)}catch(e){notes.push("Couldn't read "+f.name)}}
      for(const p of reroute){const mt=dataUrlType(p.data);if(/^image\/(png|jpeg|gif|webp)$/.test(mt))pushBin(p.name,mt,p.data.split(",")[1])}
      let x=null;
      if(bin.length||text.trim()){afStep("docs","run","Reading "+[docs.length+docImgs.length+reroute.length?(docs.length+docImgs.length+reroute.length)+" document"+(docs.length+docImgs.length+reroute.length>1?"s":""):"",userNotes?"your notes":""].filter(Boolean).join(" and ")+"…");
        try{const r=await sbInvoke("om-ai",{action:"extract_financials",files:bin,text,context:{address:street||null,units:unitsHint||null,askingPrice:askingPrice||null,gbaSf:gbaSf||null}});x=r.data||{}}
        catch(e){afStep("docs","err",e.message);notes.push("Reading the documents failed: "+e.message+". You can retry, or use the import on Step 6.")}
        if(!live())return;
        if(x){const rr=Array.isArray(x.rentRoll)?x.rentRoll.length:0;const ex=Array.isArray(x.expenses)?x.expenses.length:0;
          afStep("docs","done",[rr?"rent roll ("+rr+" units)":"",ex?ex+" expense lines":"",(x.marketRentSupport&&x.marketRentSupport.rows&&x.marketRentSupport.rows.length)?"market rents":"",x.property&&x.property.street?"property facts":""].filter(Boolean).join(", ")||"Nothing usable found")}
        if(skipped.length)notes.push("Only 6 PDFs or screenshots are read per run, so these were skipped: "+skipped.join(", ")+". Read them with the import on Step 6.");
      } else afStep("docs","skip","No documents or notes");
      // 3. Fill the form (fields still empty only; tables replaced when the documents have them)
      afStep("fill","run");
      if(x){setFinUndo(finSnapshot());applyExtraction(x);(Array.isArray(x.notes)?x.notes:[]).forEach(n=>n&&notes.push(String(n)))}
      const P=(x&&x.property)||{};
      const hl=(x&&Array.isArray(x.highlights))?x.highlights.map(h=>String(h||"").trim()).filter(Boolean):[];
      if(!aiPrompt.trim()){const pr=[hl.length?hl.map(h=>h.replace(/[.\s]+$/,"")).join(". ")+".":"",userNotes].filter(Boolean).join("\n\n");if(pr)setAiPrompt(pr)}
      afStep("fill",x?"done":"skip",x?"Review each step before publishing":"Nothing to fill from documents");
      // 4. CRM listing
      const st=street.trim()||expandStreet(String(P.street||"").trim());let match=null;
      if(importedLegacyId)afStep("crm","done","Already linked to "+(((crmListings.find(l=>l.legacy_id===importedLegacyId)||{}).name)||importedLegacyId));
      else if(!st)afStep("crm","skip","No street address found — add it on this step");
      else{afStep("crm","run");match=await findCrmMatch(st,{city:city.trim()||String(P.city||""),zip:zip||String(P.zip||"")});if(!live())return;
        if(match){linkFromMatch(match);afStep("crm","done","Linked to "+(match.name||match.address))}
        else afStep("crm","ask","Not in the CRM yet — see below")}

  // ── build the generator payload (images cropped to their slide boxes) ──
  async function buildOMData(mapOverride){
    const embedded={mason:BW_HEADSHOTS.mason,bryce:BW_HEADSHOTS.bryce,cameron:BW_HEADSHOTS.cameron};
    const ag=agents.slice(0,3);
    const d={property,agents:ag,coverTag:coverTag.trim()||"FOR SALE",priceLabel,offeringText,summaryOverrides,summaryExtra,summaryNote,showPricePerUnit,summaryHidden,
      finInput,rentRollDate,rentRollIntro:introText,expenseProfile:expenseProfile.trim(),opexFootnote:opexFootnote.trim(),market,
      includeCashFlow,cashFlow:{items:cfItems,financingTerms:cfTerms},includeAerial,includeFloodMap,showPhotoLabels,logo:BW_LOGO,unitsHint};
    const mb=omMapBox(d,fin);const mapSrc=mapOverride||mapPhoto;
    const pages=[];for(let i=0;i<gridPhotos.length;i+=4)pages.push(gridPhotos.slice(i,i+4));
    const g=0.06,cw=(OM_PW-g)/2,ch=(OM_PH-g)/2;
    const gridPages=await Promise.all(pages.map(async(ph,pi)=>{const n=ph.length;const boxes=n>=4?[[cw,ch],[cw,ch],[cw,ch],[cw,ch]]:n===3?[[cw,ch],[cw,ch],[OM_PW,ch]]:n===2?[[OM_PW,ch],[OM_PW,ch]]:[[OM_PW,OM_PH]];
      return{label:pageLabels[pi]||"",photos:await Promise.all(ph.map((src,i)=>cropToBox(src,boxes[i][0],boxes[i][1],1500)))}}));
    d.img={
      cover:await cropToBox(coverPhoto,OM_PW,OM_PH,2000),hero:await cropToBox(heroPhoto,OM_PW,OM_HERO_H,2000),divider:await cropToBox(dividerPhoto,OM_PW,OM_PH,2000),

      agents:await Promise.all(ag.map(async a=>circleCut(await cropToBox(agentPhotos[a.id]||embedded[a.id]||null,1,1,500,0.2)))),gridPages
    };
    return d;
  }
