<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f5f5;--surface:#ffffff;--surface2:#f0f0f0;--surface3:#e8e8e8;--red:#dc2626;--redDark:#991b1b;--text:#1a1a1a;--muted:#666;--sub:#999;--border:#ddd;--green:#16a34a;--amber:#d97706;--blue:#2563eb;--font:'DM Sans',sans-serif;--fontH:'Barlow Condensed',sans-serif}

select{cursor:pointer}

.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.crm-thumb img{width:100%;height:100%;object-fit:cover}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.map-preview{width:100%;border-radius:6px;border:1px solid var(--border);display:block}

<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ════════════════════════════════════════════════════════
// SUPABASE CONFIG (same as CRM)
// ════════════════════════════════════════════════════════
const SB_URL="https://khctptruikafdcxqsvvy.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtoY3RwdHJ1aWthZmRjeHFzdnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMjgzNjAsImV4cCI6MjA4ODYwNDM2MH0.McOv-IDQjDYArugi_QhYJoW9fCItMYF6h6AsDcG1h5g";

// Refresh the Supabase session using the stored refresh_token.
// Returns the new access_token on success, or null (caller should force re-login).
async function sbRefresh(){
  const refresh_token=localStorage.getItem("sb_refresh");
  if(!refresh_token)return null;
  try{
    const r=await fetch(SB_URL+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify({refresh_token})});
    if(!r.ok)return null;
    const d=await r.json();
    if(d.access_token){
      localStorage.setItem("sb_token",d.access_token);
      if(d.refresh_token)localStorage.setItem("sb_refresh",d.refresh_token);
      if(d.user)localStorage.setItem("sb_user",JSON.stringify(d.user));
      return d.access_token;
    }
  }catch(e){/* fall through to null */}
  return null;
}

async function sbFetch(path,opts={},_retried){
  const token=localStorage.getItem("sb_token");
  const headers={"Content-Type":"application/json","apikey":SB_KEY,...(token?{"Authorization":"Bearer "+token}:{}),...(opts.headers||{})};
  const r=await fetch(SB_URL+path,{...opts,headers});
  // Access token expired -> transparently refresh once and retry.
  if(r.status===401&&!_retried){
    const nt=await sbRefresh();
    if(nt)return sbFetch(path,opts,true);
    // Refresh failed: session is truly dead. Clear it so the app drops to the login screen.
    localStorage.removeItem("sb_token");localStorage.removeItem("sb_refresh");localStorage.removeItem("sb_user");
    window.dispatchEvent(new Event("sb-session-expired"));
  }
  if(!r.ok)throw new Error(await r.text());
  const text=await r.text();
  return text?JSON.parse(text):null;
}

async function sbAuth(email,password){
  const r=await fetch(SB_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":SB_KEY},body:JSON.stringify({email,password})});
  if(!r.ok){const e=await r.json();throw new Error(e.error_description||e.msg||"Login failed")}
  return r.json();
}

// Two-factor: a password alone gives an "aal1" token; the database only opens
// listings to "aal2" (password + authenticator code), the same as the CRM.
function tokenAal(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).aal||"aal1"}catch(e){return null}}
async function sbMfaVerify(token,factorId,code){
  const h={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+token};
  const c=await fetch(SB_URL+"/auth/v1/factors/"+factorId+"/challenge",{method:"POST",headers:h,body:"{}"});
  const cj=await c.json().catch(()=>({}));
  if(!c.ok||!cj.id)throw new Error(cj.msg||cj.error_description||"Could not start 2FA check");
  const v=await fetch(SB_URL+"/auth/v1/factors/"+factorId+"/verify",{method:"POST",headers:h,body:JSON.stringify({challenge_id:cj.id,code})});
  const vj=await v.json().catch(()=>({}));
  if(!v.ok||!vj.access_token)throw new Error(vj.msg||vj.error_description||"Invalid code. Try again.");
  return vj;
}

// ==OM-GEN-START== (plain JS, no JSX: shared by the browser app and the node test harness)
// ════════════════════════════════════════════════════════
// OM DECK GENERATOR — matches the Canva reference (1039 Marais OM, Sep 2026)
// US Letter landscape 11 x 8.5 in. Brand pages in Poppins; financial pages in Arial.
// All images arrive PRE-CROPPED to their box aspect (see prepareImages in the app),
// so slides place them with plain x/y/w/h and nothing is distorted.
// ════════════════════════════════════════════════════════
var OM_PW=11, OM_PH=8.5;
var OMC={dark:"242424",tabRed:"ED1C2B",rule:"D60A0A",slate:"4F5858",maroon:"8C2B34",hdr:"1A1A1A",egi:"F2EEEA",stripe:"F8F8F8",line:"E2E2E2",gray:"6B6B6B",ink:"222222",white:"FFFFFF",cardBorder:"D9D9D9"};
var OM_FONT="Poppins", OM_FIN_FONT="Arial";
var OM_OFFICE=["Bridgewater Realty Advisors","www.bridgewater.realty","3501 Severn Ave, Suite 19","Metairie, LA, 70002","504-901-0463","Licensed in LA, MS"];
var OM_DISCLAIMER="The information provided herein has been secured from sources we believe to be reliable, but we make no representations or warranties, expressed or implied, as to the accuracy or completeness of the information. References to square footage, age, or any other details are approximate and subject to errors, omissions, or changes. It is the buyer’s responsibility to independently verify the information and bear all risks associated with any inaccuracies. We do not guarantee, warranty, or represent the accuracy, suitability, or performance of the property. Any projections, opinions, assumptions, or estimates are provided for illustrative purposes only and should not be considered as indicators of current or future property performance. The value of this transaction is contingent upon various factors, including tax considerations, which should be assessed by your own tax, financial, and legal advisors. Prior to making any decisions, you and your advisors should conduct a thorough and independent investigation to ensure the property’s suitability for your specific needs. Bridgewater Realty Advisors is a Real Estate Brokerage licensed in LA, MS.";
var OM_FIN_FOOTER="All information herein is deemed reliable but not guaranteed. Buyer and buyer’s agents must independently verify all information prior to closing.";

// ── number helpers ──
function omNum(v){if(v===null||v===undefined||v==="")return 0;var n=Number(String(v).replace(/[$,%\s]/g,""));return isFinite(n)?n:0}
function omHas(v){return v!==null&&v!==undefined&&String(v).trim()!==""&&isFinite(Number(String(v).replace(/[$,%\s]/g,"")))}
function omMoney(n,dec){dec=dec||0;var v=Math.abs(n);var s="$"+v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec});return n<0?"("+s+")":s}
function omMoneyNeg(n,dec){return omMoney(-Math.abs(n),dec)}            // expense style: always in parentheses (zero shows $0)
function omMoneyCell(n,dec,neg){if(Math.round(Math.abs(n)*100)===0)return dec?"$0.00":"$0";return neg?omMoneyNeg(n,dec):omMoney(n,dec)}
function omPct(x,dec){if(!isFinite(x))return "—";return (x*100).toFixed(dec===undefined?1:dec)+"%"}
function omInt(n){return Math.round(n).toLocaleString("en-US")}
function omPhone(p){var d=String(p||"").replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);return d.length===10?d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6):String(p||"")}
function omWordNum(n){var w=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve"];return n>=0&&n<w.length?w[n]:String(n)}
// "2 BED / 1 BATH", "2BR/1BA", "2 bd 1 ba" -> {beds,baths}
function omParseType(t){var s=String(t||"").toLowerCase();var b=s.match(/(\d+(?:\.\d+)?)\s*(?:bd|bed|br|bedroom)/);var ba=s.match(/(\d+(?:\.\d+)?)\s*(?:ba|bath|bathroom)/);if(/studio/.test(s))return{beds:0,baths:ba?Number(ba[1]):1};return{beds:b?Number(b[1]):null,baths:ba?Number(ba[1]):null}}
function omTypeLabel(t){var p=omParseType(t);if(p.beds===null||p.baths===null)return String(t||"");return (p.beds===0?"Studio":p.beds+" BD")+" / "+p.baths+" BA"}

// ════════════════════════════════════════════════════════
// FINANCIAL MODEL — every number on pages 3, 10, 11, 12 comes from here so they always tie.
// ════════════════════════════════════════════════════════
function omCalc(inp){
  var rr=(inp.rentRoll||[]).filter(function(u){return u&&(String(u.unit||"").trim()||omHas(u.currentRent)||omHas(u.modeledRent)||omHas(u.proformaRent)||String(u.type||"").trim())});
  var units=rr.length||omNum(inp.units);
  var gba=omNum(inp.gbaSf), price=omNum(inp.price);
  var rows=rr.map(function(u){
    var vacant=/vac/i.test(String(u.status||""));
    var actual=vacant?0:omNum(u.currentRent);
    var modeled=omHas(u.modeledRent)?omNum(u.modeledRent):actual;
    var pf=omHas(u.proformaRent)?omNum(u.proformaRent):modeled;
    return{unit:String(u.unit||""),type:omTypeLabel(u.type),rawType:u.type,vacant:vacant,status:vacant?"Vacant":"Occupied",actual:actual,modeled:modeled,proforma:pf,upside:pf-actual};
  });
  var occupied=rows.filter(function(r){return !r.vacant}).length;
  var inPlaceMo=rows.reduce(function(s,r){return s+r.actual},0);
  var schedMo=rows.reduce(function(s,r){return s+r.modeled},0);
  var pfMo=rows.reduce(function(s,r){return s+r.proforma},0);
  var vacPct=omHas(inp.vacancyPct)?omNum(inp.vacancyPct)/100:0.05;
  var other=omNum(inp.otherIncome);
  function opex(gpr){
    var vac=gpr*vacPct, egi=gpr-vac+other;
    var lines=(inp.expenses||[]).filter(function(e){return e&&String(e.label||"").trim()}).map(function(e){
      var a=omNum(e.amount),amt;

// VALIDATION — nothing placeholder-like may reach the deck
// ════════════════════════════════════════════════════════
function validateOM(d,f){
  var e=[],w=[];var P=d.property||{};
  if(!String(P.street||"").trim())e.push("Property street address is missing (Step 1).");
  if(!String(P.cityLine||"").trim())e.push("City, State and ZIP are missing (Step 1).");
  if(!String(P.unitDescription||"").trim())e.push("Unit description is missing (Step 1), e.g. “6-unit Apartment Complex”.");
  if(!f.price)e.push("Asking price is missing (Step 1).");
  if(!f.gba)e.push("GBA (gross building area) is missing (Step 1).");
  var ag=d.agents||[];if(!ag.length)e.push("Select at least one agent (Step 2).");if(ag.length>3)e.push("The OM layout fits 3 agents; deselect "+(ag.length-3)+" (Step 2).");
  ag.slice(0,3).forEach(function(a,i){if(!d.img.agents[i])e.push("Headshot missing for "+a.name+" (Step 2).");if(!String(a.phone||"").trim())e.push("Phone number missing for "+a.name+" (Step 2).")});
  if(!d.img.cover)e.push("Cover photo is missing (Step 3).");
  if(!d.img.hero)e.push("Hero photo (page 2) is missing (Step 3).");
  if(!d.img.map)e.push("Map is missing (Step 3): click “Generate map from address”.");
  if(!d.img.divider)e.push("Financial Overview photo is missing (Step 3).");
  if(!(d.img.gridPages||[]).length)e.push("Add property photos for the photo pages (Step 3).");
  var ow=String(d.offeringText||"").trim().split(/\s+/).filter(Boolean).length;if(!ow)e.push("Offering description is empty (Step 4).");else if(ow<120)w.push("The offering text is "+ow+" words; about 170\u2013230 fills the panel like the reference.");
  if(!f.rows.length)e.push("Rent roll is empty (Step 6).");
  f.rows.forEach(function(r){if(!r.modeled)e.push("Unit "+(r.unit||"?")+" has no rent (Step 6).");var pt=omParseType(r.type);if(pt.beds===null||pt.baths===null)w.push("Unit "+(r.unit||"?")+" type “"+(r.rawType||"")+"” isn’t in “2 BD / 1 BA” form.")});
  if(!f.cur.lines.length)e.push("Add operating expenses (Step 6).");
  if(d.includeAerial&&!d.img.aerial)e.push("Aerial slide is on but no aerial image was added (Step 3).");
  if(d.includeFloodMap&&!d.img.flood)e.push("Flood map slide is on but no flood map image was added (Step 3).");
  var texts=[P.street,P.cityLine,P.unitDescription,d.offeringText,d.rentRollIntro,d.summaryNote].concat(ag.map(function(a){return a.name+" "+a.title+" "+a.email}));
  texts.forEach(function(t){if(/\[|\]|\bTBD\b|\binsert\b|lorem ipsum|placeholder/i.test(String(t||"")))e.push("Placeholder text found: “"+String(t).slice(0,60)+"”.")});
  if(f.units&&omNum(d.unitsHint)&&omNum(d.unitsHint)!==f.units)w.push("CRM lists "+d.unitsHint+" units but the rent roll has "+f.units+".");
  return{errors:e,warnings:w};
}

function generateFullOM(d){

}

function LoginScreen({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const[mfa,setMfa]=useState(null);const[code,setCode]=useState("");const[noFactor,setNoFactor]=useState(false);
  const store=r=>{localStorage.setItem("sb_token",r.access_token);if(r.refresh_token)localStorage.setItem("sb_refresh",r.refresh_token);localStorage.setItem("sb_user",JSON.stringify(r.user));};
  const handleLogin=async()=>{setErr("");setLoading(true);try{const r=await sbAuth(email,pass);
    if(tokenAal(r.access_token)==="aal2"){store(r);onLogin(r.user);return;}
    const f=((r.user&&r.user.factors)||[]).find(x=>x.factor_type==="totp"&&x.status==="verified");
    if(!f){setNoFactor(true);return;}
    setMfa({token:r.access_token,factorId:f.id});setCode("");
  }catch(e){setErr(e.message)}finally{setLoading(false)}};
  const handleCode=async()=>{if(code.length!==6||!mfa)return;setErr("");setLoading(true);try{const r=await sbMfaVerify(mfa.token,mfa.factorId,code);store(r);onLogin(r.user)}catch(e){setErr(e.message);setCode("")}finally{setLoading(false)}};
  const back=()=>{setMfa(null);setNoFactor(false);setErr("");setCode("");setPass("")};
  if(noFactor)return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>2FA isn't set up for this account yet. Sign in to the CRM once to set it up, then come back here.</p>
    <a className="btn-red" style={{display:"block",width:"100%",textDecoration:"none",marginBottom:10,boxSizing:"border-box"}} href="https://crm.bridgewater.realty">Open the CRM</a>
    <button className="btn-dark" style={{width:"100%"}} onClick={back}>Back</button>
  </div></div>;
  if(mfa)return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>Enter the 6-digit code from your authenticator app (the same one you use for the CRM).</p>
    <div className="field"><input autoFocus inputMode="numeric" autoComplete="one-time-code" placeholder="000000" value={code} onChange={e=>setCode(e.target.value.replace(/[^0-9]/g,"").slice(0,6))} onKeyDown={e=>e.key==="Enter"&&handleCode()} style={{textAlign:"center",letterSpacing:"0.3em",fontSize:20}}/></div>
    {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}
    <button className="btn-red" style={{width:"100%",marginBottom:10}} onClick={handleCode} disabled={loading||code.length!==6}>{loading?<span className="spinner"/>:"Verify"}</button>
    <button className="btn-dark" style={{width:"100%"}} onClick={back}>Back</button>
  </div></div>;
  return <div className="login-wrap"><div className="login-box">
    <h1>BRIDGEWATER</h1><p style={{letterSpacing:3,fontSize:10,color:"var(--muted)"}}>REALTY ADVISORS</p>
    <p>OM Generator — Sign In</p>
    <div className="field"><input placeholder="Email" value={email} onChange={e=>setEmail(e.target.value)}/></div>
    <div className="field"><input type="password" placeholder="Password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()}/></div>
    {err&&<p style={{color:"var(--red)",fontSize:12,marginBottom:12}}>{err}</p>}
    <button className="btn-red" style={{width:"100%"}} onClick={handleLogin} disabled={loading}>{loading?<span className="spinner"/>:"Sign In"}</button>
  </div></div>
}

function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function fileToText(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file)})}
function fileToArrayBuffer(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsArrayBuffer(file)})}
async function urlToDataURL(url){
  try{if(!url)return null;if(/^data:/.test(url))return url;const r=await fetch(url);const b=await r.blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});}catch(e){return null;}
}
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("Couldn't read an image (HEIC photos must be converted to JPG first)"));im.src=src})}
// Cover-crop an image to a box aspect (inches) and re-encode as JPEG. Keeps photos undistorted
// and the PPTX small. vBias: 0 = keep top, 0.5 = center (headshots use a slight top bias).
async function cropToBox(src,wIn,hIn,maxPx,vBias){
  if(!src)return null;const im=await loadImg(src);const ar=wIn/hIn;let sw=im.naturalWidth,sh=im.naturalHeight,sx=0,sy=0;
  if(sw/sh>ar){const nw=Math.round(sh*ar);sx=Math.round((sw-nw)/2);sw=nw}else{const nh=Math.round(sw/ar);sy=Math.round((sh-nh)*(vBias===undefined?0.5:vBias));sh=nh}
  const ow=Math.min(maxPx||1800,sw),oh=Math.round(ow/ar);const c=document.createElement("canvas");c.width=ow;c.height=oh;
  const g=c.getContext("2d");g.imageSmoothingQuality="high";g.drawImage(im,sx,sy,sw,sh,0,0,ow,oh);return c.toDataURL("image/jpeg",0.86);
}
async function uploadPhoto(dataUrl,path){
  if(!dataUrl)return null;if(/^https?:/.test(dataUrl))return dataUrl;
  const token=localStorage.getItem("sb_token");const blob=await (await fetch(dataUrl)).blob();
  const r=await fetch(SB_URL+"/storage/v1/object/om-photos/"+path,{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+token,"Content-Type":blob.type||"image/jpeg","x-upsert":"true"},body:blob});
  if(!r.ok)throw new Error("Photo upload failed ("+r.status+")");
  return SB_URL+"/storage/v1/object/public/om-photos/"+path;
}
async function crmFileToDataURL(storage_path){
  const token=localStorage.getItem("sb_token");
  const r=await fetch(SB_URL+"/storage/v1/object/crm-files/"+storage_path,{headers:{"apikey":SB_KEY,"Authorization":"Bearer "+token}});

function SearchableListingInput({listings,value,onChange,loading}){
  const[query,setQuery]=useState("");const[open,setOpen]=useState(false);const[hi,setHi]=useState(-1);const wrapRef=useRef(null);
  const sel=listings.find(l=>l.id===value);const displayText=sel?(sel.name||sel.address||"Untitled"):"";
  const filtered=query.trim()?listings.filter(l=>{const q=query.toLowerCase();return (l.name||"").toLowerCase().includes(q)||(l.address||"").toLowerCase().includes(q)||(l.city||"").toLowerCase().includes(q)}):listings;
  useEffect(()=>{function h(e){if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false)}document.addEventListener("mousedown",h);return()=>document.removeEventListener("mousedown",h)},[]);
  function pick(id){setQuery("");setOpen(false);setHi(-1);onChange(id)}
  function key(e){if(!open)return;if(e.key==="ArrowDown"){e.preventDefault();setHi(i=>Math.min(i+1,filtered.length-1))}else if(e.key==="ArrowUp"){e.preventDefault();setHi(i=>Math.max(i-1,0))}else if(e.key==="Enter"&&hi>=0&&filtered[hi]){e.preventDefault();pick(filtered[hi].id)}else if(e.key==="Escape"){setOpen(false);setQuery("")}}
  return <div className="search-dropdown" ref={wrapRef}>
    <input type="text" value={open?query:displayText} placeholder={loading?"Loading listings...":"Search listings by name, address, or city..."} onFocus={()=>{setOpen(true);setQuery("");setHi(-1)}} onChange={e=>{setQuery(e.target.value);setHi(-1);if(!open)setOpen(true)}} onKeyDown={key} style={{background:"var(--surface2)"}}/>
    {value&&!open&&<button onClick={()=>{onChange("");setQuery("")}} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:14,padding:"2px 6px"}}>×</button>}
    {open&&<div className="dd-list">
      {filtered.length===0&&<div className="dd-empty">{query?"No listings match your search":"No listings found"}</div>}
      {filtered.map((l,i)=><div key={l.id} className={"dd-item"+(i===hi?" highlighted":"")} onClick={()=>pick(l.id)} onMouseEnter={()=>setHi(i)}>
        <div style={{fontWeight:600}}>{l.name||l.address||"Untitled"}</div>
        <div className="dd-sub">{l.city||""}{l.units?" • "+l.units+" units":""}{l.asking_price?" • $"+Number(l.asking_price).toLocaleString():""}{l.status?" • "+l.status:""}</div>
      </div>)}
    </div>}
  </div>
}

    setIncludeCashFlow(false);setCfItems(DEFAULT_CF_ITEMS());setCfTerms(DEFAULT_CF_TERMS());setFinFiles([]);setFinNotes("");setFinResult(null);setFinUndo(null);

  // ── CRM photos ──
  async function fetchCrmPhotos(legacyId){
    if(!legacyId){setCrmPhotos([]);return []}
    setLoadingCrmPhotos(true);let photos=[];
    try{
      const imgOr="or=(name.ilike.*.jpg,name.ilike.*.jpeg,name.ilike.*.png,name.ilike.*.webp)";
      const files=await sbFetch("/rest/v1/files?select=name,folder_path,storage_path&linked_listing=eq."+encodeURIComponent(legacyId)+"&"+imgOr+"&order=name.asc&limit=300");
      if(Array.isArray(files)&&files.length){let signed=[];try{signed=await sbFetch("/storage/v1/object/sign/crm-files",{method:"POST",body:JSON.stringify({expiresIn:3600,paths:files.map(f=>f.storage_path)})})}catch(e){signed=[]}
        photos=files.map((f,i)=>{const s=signed&&signed[i]&&(signed[i].signedURL||signed[i].signedUrl);return{name:f.name,folder:f.folder_path||"",storage_path:f.storage_path,thumb:s?(String(s).startsWith("http")?s:SB_URL+"/storage/v1"+s):null}});}
    }catch(e){console.error("fetchCrmPhotos",e)}
    setCrmPhotos(photos);setLoadingCrmPhotos(false);return photos;
  }
  async function assignCrmPhoto(photo,target){
    try{showToast("Loading photo…");const d=await crmFileToDataURL(photo.storage_path);
      if(target==="cover")setCoverPhoto(d);else if(target==="hero")setHeroPhoto(d);else if(target==="divider")setDividerPhoto(d);else if(target==="map")setMapPhoto(d);
      else if(target==="aerial"){setAerialPhoto(d);setIncludeAerial(true)}else if(target==="flood"){setFloodMapPhoto(d);setIncludeFloodMap(true)}
      else if(target==="grid")setGridPhotos(prev=>prev.length>=MAX_GRID?prev:prev.concat([d]));
      showToast("Photo added");}catch(e){console.error(e);showToast("Couldn't load that photo")}
  }
  async function autoAssignCrmStarter(cp){
    try{const nonAerial=cp.filter(p=>!/aerial|flood|map/i.test(p.name));const pool=nonAerial.length?nonAerial:cp;
      if(pool[0])crmFileToDataURL(pool[0].storage_path).then(setCoverPhoto).catch(()=>{});
      if(pool[1])crmFileToDataURL(pool[1].storage_path).then(setHeroPhoto).catch(()=>{});
      if(pool[2])crmFileToDataURL(pool[2].storage_path).then(setDividerPhoto).catch(()=>{});
      const rest=pool.slice(3,3+MAX_GRID);const loaded=await Promise.all(rest.map(p=>crmFileToDataURL(p.storage_path).catch(()=>null)));setGridPhotos(loaded.filter(Boolean));
      showToast("CRM photos placed — check the cover, page 2 and divider picks on Step 3");
    }catch(e){console.error(e)}
  }
  async function addGridFiles(files){
    const list=Array.from(files||[]).filter(f=>/^image\//.test(f.type)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
    const room=MAX_GRID-gridPhotos.length;if(list.length>room)showToast("Only "+MAX_GRID+" photos fit (5 pages) — extra photos skipped");
    const urls=await Promise.all(list.slice(0,Math.max(0,room)).map(fileToDataURL));setGridPhotos(prev=>prev.concat(urls).slice(0,MAX_GRID));
  }
  function moveGrid(i,dir){setGridPhotos(prev=>{const n=[...prev];const j=i+dir;if(j<0||j>=n.length)return prev;[n[i],n[j]]=[n[j],n[i]];return n})}

  // ── Map from address (Google Static Maps via om-static-map) ──
  function mapAddress(){return [street.trim(),[city.trim(),[stateAbbr,zip].filter(Boolean).join(" ")].filter(Boolean).join(", ")].filter(Boolean).join(", ")}
  async function generateMap(zoom){
    const z=zoom||mapZoom;setMapError("");if(!street.trim()||!city.trim()){setMapError("Enter the street address and city on Step 1 first.");return null}
    setMapLoading(true);

  // ── AI offering description (om-ai "offering") ──
  function buildFacts(){
    const vac=fin.rows.filter(r=>r.vacant);
    return{address:street,additionalAddresses:extraAddresses,cityStateZip:cityLine,neighborhood,unitDescription,units:fin.units||omNum(unitsHint)||null,
      grossSquareFeet:omNum(gbaSf)||null,siteSquareFeet:omNum(siteSf)||null,yearBuilt:yearBuilt||null,yearRenovated:yearRenovated||null,lot:lotDescription||null,buildingStyle:styleWord||null,
      unitMix:fin.layouts.map(l=>l.count+" x "+l.type),occupancy:fin.rows.length?(fin.occupied+" of "+fin.units+" units occupied"):null,
      vacantUnits:vac.map(r=>"Unit "+r.unit+" ("+r.type+")"),inPlaceRentMonthly:fin.inPlaceMo||null,scheduledRentMonthly:fin.schedMo||null,
      proformaRentMonthly:fin.pfMo||null,rentUpsidePct:(fin.inPlaceMo&&fin.pfMo>fin.inPlaceMo)?Math.round((fin.pfMo-fin.inPlaceMo)/fin.inPlaceMo*1000)/10:null};
  }
  async function generateAIText(){
    setAiLoading(true);setAiError("");setAiWarnings([]);
    try{const r=await sbInvoke("om-ai",{action:"offering",facts:buildFacts(),notes:aiPrompt});
      if(!r.paragraphs||!r.paragraphs.length)throw new Error("The AI returned no text — try again.");
      setOfferingText(r.paragraphs.join("\n\n"));setAiWarnings(r.warnings||[]);}

  // ── Financial import from files / notes (om-ai "extract_financials") ──
  async function readFinancials(){
    setFinLoading(true);setFinError("");setFinResult(null);
    try{
      const files=[];let text=finNotes||"";let bytes=0;
      for(const f of finFiles){
        const n=f.name.toLowerCase();
        if(/\.(xlsx|xlsm|xls|ods)$/.test(n))text+="\n\nFile: "+f.name+"\n"+await spreadsheetToText(f);
        else if(/\.(csv|tsv|txt|md)$/.test(n)||/^text\//.test(f.type))text+="\n\nFile: "+f.name+"\n"+await fileToText(f);
        else if(f.type==="application/pdf"||/^image\/(png|jpeg|gif|webp)$/.test(f.type)){const du=await fileToDataURL(f);const data=du.split(",")[1];bytes+=data.length;files.push({name:f.name,mediaType:f.type,data})}
        else throw new Error("Can't read "+f.name+" — use PDF, Excel, CSV, a photo/screenshot, or paste the numbers.");
      }
      if(bytes>18e6)throw new Error("Those files are too large together (over ~13 MB). Upload fewer pages or screenshots.");
      if(!files.length&&!text.trim())throw new Error("Upload a file or paste notes first.");
      const r=await sbInvoke("om-ai",{action:"extract_financials",files,text,context:{address:street,units:unitsHint||null,askingPrice:askingPrice||null,gbaSf:gbaSf||null}});
      setFinResult(r.data||{});
    }catch(e){setFinError(e.message)}
    setFinLoading(false);
  }
  function applyFinResult(){
    const x=finResult||{};
    setFinUndo({rentRoll,vacancyPct,otherIncome,expenses,market,rentRollDate,askingPrice,gbaSf,siteSf,yearBuilt,yearRenovated,neighborhood});
    if(Array.isArray(x.rentRoll)&&x.rentRoll.length)setRentRoll(x.rentRoll.map((u,i)=>{const vac=/vac/i.test(u.status||"")||!omNum(u.currentRent);return{unit:String(u.unit||i+1),type:omTypeLabel(u.type||""),status:vac?"Vacant":"Occupied",currentRent:vac?"":String(omNum(u.currentRent)),modeledRent:omHas(u.modeledRent)?String(omNum(u.modeledRent)):(vac?"":String(omNum(u.currentRent))),proformaRent:omHas(u.proformaRent)?String(omNum(u.proformaRent)):""}}));
    if(omHas(x.vacancyPct))setVacancyPct(String(omNum(x.vacancyPct)));
    if(omHas(x.otherIncome))setOtherIncome(String(omNum(x.otherIncome)));
    if(Array.isArray(x.expenses)&&x.expenses.length)setExpenses(x.expenses.map(e=>({label:e.label||"",basis:["fixed","pctEGI","perSF","perUnit"].includes(e.basis)?e.basis:"fixed",amount:omHas(e.amount)?String(omNum(e.amount)):""})));
    if(x.marketRentSupport&&Array.isArray(x.marketRentSupport.rows)&&x.marketRentSupport.rows.length)setMarket({source:x.marketRentSupport.source||"",rows:x.marketRentSupport.rows.map(r=>({unitType:r.unitType||"",sample:r.sample??"",p25:r.p25??"",median:r.median??"",avg:r.avg??"",p75:r.p75??"",applied:r.applied??""}))});
    if(x.rentRollDate)setRentRollDate(String(x.rentRollDate));
    const P=x.property||{};
    if(omHas(P.askingPrice)&&!omHas(askingPrice))setAskingPrice(String(omNum(P.askingPrice)));
    if(omHas(P.gbaSf)&&!omHas(gbaSf))setGbaSf(String(omNum(P.gbaSf)));
    if(omHas(P.siteSf)&&!omHas(siteSf))setSiteSf(String(omNum(P.siteSf)));
    if(P.yearBuilt&&!yearBuilt)setYearBuilt(String(P.yearBuilt));if(P.yearRenovated&&!yearRenovated)setYearRenovated(String(P.yearRenovated));
    if(P.neighborhood&&!neighborhood)setNeighborhood(String(P.neighborhood));
    setFinResult(null);showToast("Financials filled in — review the tables below");
  }
  function undoFin(){const u=finUndo;if(!u)return;setRentRoll(u.rentRoll);setVacancyPct(u.vacancyPct);setOtherIncome(u.otherIncome);setExpenses(u.expenses);setMarket(u.market);setRentRollDate(u.rentRollDate);setAskingPrice(u.askingPrice);setGbaSf(u.gbaSf);setSiteSf(u.siteSf);setYearBuilt(u.yearBuilt);setYearRenovated(u.yearRenovated);setNeighborhood(u.neighborhood);setFinUndo(null);showToast("Import undone")}

  // ── build the generator payload (images cropped to their slide boxes) ──
  async function buildOMData(mapOverride){
    const embedded={mason:BW_HEADSHOTS.mason,bryce:BW_HEADSHOTS.bryce,cameron:BW_HEADSHOTS.cameron};
    const ag=agents.slice(0,3);
    const d={property,agents:ag,coverTag:coverTag.trim()||"FOR SALE",priceLabel,offeringText,summaryOverrides,summaryExtra,summaryNote,showPricePerUnit,
      finInput,rentRollDate,rentRollIntro:introText,expenseProfile:expenseProfile.trim(),opexFootnote:opexFootnote.trim(),market,
      includeCashFlow,cashFlow:{items:cfItems,financingTerms:cfTerms},includeAerial,includeFloodMap,showPhotoLabels,logo:BW_LOGO,unitsHint};
    const mb=omMapBox(d,fin);const mapSrc=mapOverride||mapPhoto;
    const pages=[];for(let i=0;i<gridPhotos.length;i+=4)pages.push(gridPhotos.slice(i,i+4));
    const g=0.06,cw=(OM_PW-g)/2,ch=(OM_PH-g)/2;
    const gridPages=await Promise.all(pages.map(async(ph,pi)=>{const n=ph.length;const boxes=n>=4?[[cw,ch],[cw,ch],[cw,ch],[cw,ch]]:n===3?[[cw,ch],[cw,ch],[OM_PW,ch]]:n===2?[[OM_PW,ch],[OM_PW,ch]]:[[OM_PW,OM_PH]];
      return{label:pageLabels[pi]||"",photos:await Promise.all(ph.map((src,i)=>cropToBox(src,boxes[i][0],boxes[i][1],1500)))}}));
    d.img={
      cover:await cropToBox(coverPhoto,OM_PW,OM_PH,2000),hero:await cropToBox(heroPhoto,OM_PW,6.58,2000),divider:await cropToBox(dividerPhoto,OM_PW,OM_PH,2000),
      map:await cropToBox(mapSrc,mb.w,mb.h,1400),aerial:includeAerial?await cropToBox(aerialPhoto,OM_PW,OM_PH,2000):null,flood:includeFloodMap?await cropToBox(floodMapPhoto,OM_PW,OM_PH,2000):null,
      agents:await Promise.all(ag.map(a=>cropToBox(agentPhotos[a.id]||embedded[a.id]||null,1,1,500,0.2))),gridPages
    };
    return d;
  }

  async function handleGenerate(){
    setGenerating(true);setGenErrors(null);
    try{
      let mapOverride=null;if(!mapPhoto&&street.trim()&&city.trim())mapOverride=await generateMap(mapZoom);
      const d=await buildOMData(mapOverride);
      const v=validateOM(d,fin);
      if(v.errors.length){setGenErrors(v);showToast("Fix the items listed before downloading");setGenerating(false);return}
      setGenErrors(v.warnings.length?{errors:[],warnings:v.warnings}:null);
      const pres=generateFullOM(d);
      const fileName=(street||propertyName||"Property").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"")+"_OM.pptx";
      await pres.writeFile({fileName});
      showToast("OM downloaded");
    }catch(e){console.error(e);setGenErrors({errors:["Couldn't build the OM: "+(e.message||e)],warnings:[]})}
    setGenerating(false);
  }

              </label>
              {on&&(!BW_HEADSHOTS[a.id]||!a.phone)&&<div className="agent-fix">
                {!a.phone&&<div className="grid2"><input placeholder="Mobile phone" value={ed.phone||""} onChange={e=>setAgentEdits({...agentEdits,[a.id]:{...(agentEdits[a.id]||{}),phone:e.target.value}})}/><input placeholder="Title" value={ed.title||""} onChange={e=>setAgentEdits({...agentEdits,[a.id]:{...(agentEdits[a.id]||{}),title:e.target.value}})}/></div>}
                {!BW_HEADSHOTS[a.id]&&<div style={{marginTop:6}}><PhotoUpload value={agentPhotos[a.id]||null} onChange={v=>setAgentPhotos({...agentPhotos,[a.id]:v})} label="Upload headshot"/></div>}
              </div>}
            </div>})}
        </div>
        {nav(1,3,"Next: Photos →")}
      </div>}

      {/* STEP 3 — PHOTOS */}
      {step===3&&<div>
        <h2>Photos & Map</h2>
        {(importedLegacyId||crmPhotos.length>0)&&<div className="card" style={{marginBottom:20}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><h3 style={{margin:0}}>CRM Photos{crmPhotos.length?" ("+crmPhotos.length+")":""}</h3>{loadingCrmPhotos&&<span className="spinner"/>}<div style={{flex:1}}/><button className="btn-dark btn-sm" onClick={()=>fetchCrmPhotos(importedLegacyId)} disabled={loadingCrmPhotos||!importedLegacyId}>Reload</button></div>
          {crmPhotos.length===0&&!loadingCrmPhotos&&<p className="hint">No CRM photos found for this listing. Upload below.</p>}
          {crmPhotos.length>0&&<div className="crm-grid">{crmPhotos.map((p,i)=><div key={i} style={{fontSize:10}}>
            <div className="crm-thumb">{p.thumb?<img src={p.thumb} loading="lazy"/>:<span style={{color:"var(--sub)"}}>no preview</span>}</div>
            <div className="ellipsis" title={p.name}>{p.name}</div>
            <select defaultValue="" onChange={e=>{if(e.target.value){assignCrmPhoto(p,e.target.value);e.target.value=""}}} style={{fontSize:10,padding:"3px 4px",marginTop:2}}>
              <option value="">Use as…</option><option value="cover">Cover (page 1)</option><option value="hero">Page 2 hero</option><option value="divider">Financial divider</option><option value="grid">Add to photo pages</option><option value="aerial">Aerial page</option><option value="flood">Flood map page</option>
            </select></div>)}</div>}
        </div>}
        <div className="grid3" style={{marginBottom:18}}>
          <div className="section"><h3>Cover (page 1)</h3><PhotoUpload value={coverPhoto} onChange={setCoverPhoto} label="Best exterior shot" tall/></div>
          <div className="section"><h3>Page 2 hero</h3><PhotoUpload value={heroPhoto} onChange={setHeroPhoto} label="Front elevation" tall/></div>
          <div className="section"><h3>Financial divider</h3><PhotoUpload value={dividerPhoto} onChange={setDividerPhoto} label="Rear / alternate exterior" tall/></div>
        </div>
        <div className="card" style={{marginBottom:18}}>
          <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:"1 1 260px"}}>
              <h3>Summary map</h3>
              <p className="hint" style={{marginBottom:10}}>Pulled from Google Maps using the address on Step 1{street?": "+mapAddress():""}.</p>
              <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
                <button className="btn-red btn-sm" onClick={()=>generateMap()} disabled={mapLoading}>{mapLoading?<><span className="spinner" style={{marginRight:6}}/>Getting map…</>:(mapPhoto?"↻ Regenerate map":"Generate map from address")}</button>
                <span className="hint">Zoom</span>
                <button className="btn-dark btn-sm" disabled={mapLoading||mapZoom<=11} onClick={()=>generateMap(mapZoom-1)}>− wider</button>
                <button className="btn-dark btn-sm" disabled={mapLoading||mapZoom>=18} onClick={()=>generateMap(mapZoom+1)}>+ closer</button>
              </div>
              {mapError&&<p className="err">{mapError}</p>}
              <p className="hint" style={{marginTop:10}}>Or upload your own map screenshot:</p>
              <div style={{maxWidth:220}}><PhotoUpload value={null} onChange={setMapPhoto} label="Upload map image"/></div>
            </div>
            <div style={{flex:"1 1 280px"}}>{mapPhoto?<div style={{position:"relative"}}><img src={mapPhoto} className="map-preview"/><button className="x-btn" onClick={()=>setMapPhoto(null)}>×</button></div>:<div className="map-empty">No map yet</div>}</div>
          </div>
        </div>
        {(includeAerial||includeFloodMap)&&<div className="grid2" style={{marginBottom:18}}>
          {includeAerial&&<div className="section"><h3>Aerial view</h3><PhotoUpload value={aerialPhoto} onChange={setAerialPhoto} label="Satellite / drone image"/></div>}
          {includeFloodMap&&<div className="section"><h3>Flood map</h3><PhotoUpload value={floodMapPhoto} onChange={setFloodMapPhoto} label="FEMA flood map"/></div>}
        </div>}
        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <h3 style={{margin:0}}>Photo pages <span className="hint">({gridPhotos.length}/{MAX_GRID} photos · {Math.ceil(gridPhotos.length/4)} page{Math.ceil(gridPhotos.length/4)===1?"":"s"})</span></h3>
            <div style={{flex:1}}/>
            <label className="check" style={{margin:0}}><input type="checkbox" checked={showPhotoLabels} onChange={e=>setShowPhotoLabels(e.target.checked)}/> Red label on each page</label>
            <label className="btn-red btn-sm file-btn">+ Add photos<input type="file" accept="image/*" multiple onChange={e=>{addGridFiles(e.target.files);e.target.value=""}}/></label>
            {gridPhotos.length>0&&<button className="btn-dark btn-sm" onClick={()=>setGridPhotos([])}>Clear</button>}
          </div>
          <p className="hint" style={{margin:"8px 0 12px"}}>4 photos per page, in this order (multi-select adds files sorted by name). A last page with 2 or 3 photos uses a matching layout, never an empty square. Keep the cover/hero/divider shots out of this list.</p>
          {Array.from({length:Math.ceil(gridPhotos.length/4)}).map((_,pi)=><div key={pi} className="grid-page">
            <div className="grid-page-h">Page {pi+1}{showPhotoLabels&&<input value={pageLabels[pi]||""} onChange={e=>{const n=[...pageLabels];n[pi]=e.target.value;setPageLabels(n)}} placeholder="Label, e.g. 8019 Trapier" style={{width:220,marginLeft:10}}/>}</div>
            <div className="grid-thumbs">{gridPhotos.slice(pi*4,pi*4+4).map((src,j)=>{const i=pi*4+j;return <div key={i} className="grid-thumb"><img src={src}/>
              <div className="grid-tools"><button onClick={()=>moveGrid(i,-1)} disabled={i===0}>◀</button><span>{i+1}</span><button onClick={()=>moveGrid(i,1)} disabled={i===gridPhotos.length-1}>▶</button><button onClick={()=>setGridPhotos(gridPhotos.filter((_,k)=>k!==i))}>×</button></div></div>})}</div>
          </div>)}
        </div>
        {nav(2,4,"Next: Offering →")}
      </div>}

      {/* STEP 4 — OFFERING */}
      {step===4&&<div>
        <h2>Offering Description</h2>
        <div className="card" style={{marginBottom:14}}>
          <label>Tell the AI about the property</label>
          <textarea value={aiPrompt} onChange={e=>setAiPrompt(e.target.value)} rows={5} placeholder={AI_PLACEHOLDER}/>
          <div style={{display:"flex",alignItems:"center",gap:12,marginTop:10,flexWrap:"wrap"}}>
            <button className="btn-red" onClick={generateAIText} disabled={aiLoading}>{aiLoading?<><span className="spinner" style={{marginRight:6}}/>Writing…</>:(offeringText?"✦ Rewrite with AI":"✦ Write with AI")}</button>
            <span className="hint">Uses your notes plus the facts from Steps 1 and 6: {fin.units||"?"} units{fin.layouts.length?" · "+fin.layouts.map(l=>l.label).join(", "):""}{fin.rows.length?" · "+fin.occupied+"/"+fin.units+" occupied":""}{gbaSf?" · "+omInt(omNum(gbaSf))+" sf":""}</span>
          </div>
          {!fin.rows.some(r=>r.modeled)&&<p className="warn-box">Tip: fill in the rent roll (Step 6) first so the AI gets the unit mix and occupancy right.</p>}
          {aiError&&<p className="err">{aiError}</p>}
          {aiWarnings.length>0&&<div className="warn-box"><b>Check your notes:</b><ul>{aiWarnings.map((w,i)=><li key={i}>{w}</li>)}</ul></div>}
        </div>
        <label>Offering text (page 3, left panel). Separate paragraphs with a blank line.</label>
        <textarea value={offeringText} onChange={e=>setOfferingText(e.target.value)} rows={16} placeholder="Write here, or use the AI above."/>
        <div className="hint">{offeringText.trim().split(/\s+/).filter(Boolean).length} words · aim for about 170–230 so it fills the panel at full size.</div>
        {nav(3,5,"Next: Summary →")}
      </div>}

      {/* STEP 5 — SUMMARY */}
      {step===5&&<div>
        <h2>Summary</h2>
        <p className="lead">These numbers are calculated from Steps 1 and 6, so they always match the financial pages. Type in the override box only if you need different wording.</p>
        <div className="grid2">
          {[["Left column",summaryRows.left],["Right column",summaryRows.right]].map(([t,rows])=><div key={t} className="card">
            <h3>{t}</h3>
            {rows.map(r=><div key={r.key} className="sum-row">
              <div className="sum-l">{r.label}</div>
              <div className="sum-v">{String(r.value).split("\n").map((x,i)=><div key={i}>{x}</div>)}</div>
              {r.key.charAt(0)!=="x"&&<input className="sum-o" placeholder="override" value={summaryOverrides[r.key]||""} onChange={e=>setSummaryOverrides({...summaryOverrides,[r.key]:e.target.value})}/>}
            </div>)}
          </div>)}
        </div>
        {["price","ppsf","income","site","layouts","units","gba","occ","ipcap","pfcap"].filter(k=>!summaryRows.left.concat(summaryRows.right).some(r=>r.key===k)).length>0&&<p className="hint" style={{marginTop:8}}>Rows without a value are left off the page (fill in Steps 1 and 6 to add them).</p>}
        <div className="card" style={{marginTop:14}}>
          <label className="check"><input type="checkbox" checked={showPricePerUnit} onChange={e=>setShowPricePerUnit(e.target.checked)}/> Also show PRICE PER UNIT</label>
          <h3 style={{marginTop:12}}>Extra rows (optional)</h3>
          {summaryExtra.map((x,i)=><div key={i} style={{display:"flex",gap:6,marginBottom:6}}><input value={x.label} onChange={e=>{const n=[...summaryExtra];n[i]={...n[i],label:e.target.value};setSummaryExtra(n)}} placeholder="Label, e.g. FLOOD ZONE" style={{width:"40%"}}/><input value={x.value} onChange={e=>{const n=[...summaryExtra];n[i]={...n[i],value:e.target.value};setSummaryExtra(n)}} placeholder="Value"/><button className="remove-btn" onClick={()=>setSummaryExtra(summaryExtra.filter((_,j)=>j!==i))}>×</button></div>)}
          <button className="add-row-btn" onClick={()=>setSummaryExtra([...summaryExtra,{label:"",value:""}])}>+ Add row</button>
          <div className="field" style={{marginTop:12}}><label>Note under the summary (red, optional)</label><input value={summaryNote} onChange={e=>setSummaryNote(e.target.value)} placeholder="e.g. *ALL REPAIRS COMPLETED IN 2024*"/></div>
        </div>
        {nav(4,6,"Next: Financials →")}
      </div>}

      {/* STEP 6 — FINANCIALS */}
      {step===6&&<div>
        <h2>Financials</h2>
        <div className="card import-card">
          <h3>Fill from the seller's files or your notes</h3>
          <p className="hint" style={{marginBottom:10}}>Upload a rent roll, T-12, tax bill, insurance quote, Rentometer report (PDF, Excel, CSV or screenshots), or paste your notes. The AI fills the tables below for you to check.</p>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <label className="btn-dark btn-sm file-btn">Choose files<input type="file" multiple accept=".pdf,.xlsx,.xls,.xlsm,.csv,.tsv,.txt,.md,image/*" onChange={e=>{setFinFiles(Array.from(e.target.files||[]));e.target.value=""}}/></label>
            {finFiles.map((f,i)=><span key={i} className="chip">{f.name}<button onClick={()=>setFinFiles(finFiles.filter((_,j)=>j!==i))}>×</button></span>)}
          </div>
          <textarea value={finNotes} onChange={e=>setFinNotes(e.target.value)} rows={4} style={{marginTop:10}} placeholder={"Or paste notes, e.g.\nUnit 1 2/1 $1550, Unit 2 1/1 $1100, Unit 4 vacant (ask $1200)…\nTaxes after sale ~$11,500, insurance $12,888, tenants pay utilities, R&M $1/sf, mgmt 6%"}/>
          <div style={{display:"flex",gap:10,alignItems:"center",marginTop:10,flexWrap:"wrap"}}>
            <button className="btn-red" onClick={readFinancials} disabled={finLoading}>{finLoading?<><span className="spinner" style={{marginRight:6}}/>Reading…</>:"✦ Read with AI"}</button>
            {finUndo&&<button className="btn-dark btn-sm" onClick={undoFin}>Undo last import</button>}
          </div>
          {finError&&<p className="err">{finError}</p>}
          {finResult&&<div className="result-box">
            <b>Found:</b> {(finResult.rentRoll||[]).length} units · {(finResult.expenses||[]).length} expense lines{finResult.marketRentSupport&&(finResult.marketRentSupport.rows||[]).length?" · market rent data":""}{omHas(finResult.vacancyPct)?" · "+finResult.vacancyPct+"% vacancy":""}
            {(finResult.notes||[]).length>0&&<ul>{finResult.notes.map((n,i)=><li key={i}>{n}</li>)}</ul>}
            <div style={{marginTop:8,display:"flex",gap:8}}><button className="btn-green btn-sm" onClick={applyFinResult}>Use these numbers</button><button className="btn-dark btn-sm" onClick={()=>setFinResult(null)}>Discard</button></div>
          </div>}
        </div>

        <div className="calc-strip sticky">
          <Stat label="In-place rent" value={money(fin.inPlaceMo)+"/mo"}/>
          <Stat label="Scheduled (GPR)" value={money(fin.schedMo)+"/mo"}/>
          <Stat label="EGI" value={money(fin.cur.egi)}/>
          <Stat label="OpEx" value={money(fin.cur.total)+" · "+pctF(fin.cur.ratio)}/>
          <Stat label="NOI" value={money(fin.cur.noi)}/>
          <Stat label="In-place cap" value={pctF(fin.inPlaceCap)}/>
          <Stat label="Pro forma cap" value={pctF(fin.proformaCap)}/>
        </div>

        <div className="section">
          <h3>Rent roll</h3>
          <table className="fin-table"><thead><tr><th>Unit</th><th>Type</th><th>Status</th><th>Actual rent /mo</th><th>Modeled rent /mo</th><th>Pro forma rent /mo</th><th></th></tr></thead><tbody>
            {rentRoll.map((u,i)=><tr key={i} className={u.status==="Vacant"?"vac":""}>
              <td><input value={u.unit} onChange={e=>updRR(i,"unit",e.target.value)} style={{width:56}}/></td>
              <td><input value={u.type} onChange={e=>updRR(i,"type",e.target.value)} onBlur={e=>updRR(i,"type",omTypeLabel(e.target.value))} placeholder="2 BD / 1 BA" style={{width:110}}/></td>
              <td><select value={u.status} onChange={e=>updRR(i,"status",e.target.value)} style={{width:104}}><option>Occupied</option><option>Vacant</option></select></td>
              <td><Num value={u.currentRent} onChange={v=>updRR(i,"currentRent",v)} placeholder={u.status==="Vacant"?"—":""} style={{width:96}}/></td>
              <td><Num value={u.modeledRent} onChange={v=>updRR(i,"modeledRent",v)} placeholder={u.status==="Vacant"?"asking rent":"= actual"} style={{width:96}}/></td>
              <td><Num value={u.proformaRent} onChange={v=>updRR(i,"proformaRent",v)} placeholder="market" style={{width:96}}/></td>
              <td><button className="remove-btn" onClick={()=>setRentRoll(rentRoll.filter((_,j)=>j!==i))}>×</button></td>
            </tr>)}
            <tr className="tot"><td colSpan={3}>Totals · {fin.units} units · {fin.occupied} occupied</td><td>{money(fin.inPlaceMo)}</td><td>{money(fin.schedMo)}</td><td>{money(fin.pfMo)}</td><td/></tr>
          </tbody></table>
          <button className="add-row-btn" onClick={()=>{const last=rentRoll[rentRoll.length-1];setRentRoll([...rentRoll,{unit:String((parseInt(last&&last.unit,10)||rentRoll.length)+1),type:(last&&last.type)||"",status:"Occupied",currentRent:"",modeledRent:"",proformaRent:""}])}}>+ Add unit</button>
          <p className="hint" style={{marginTop:6}}>Actual = rent being collected. Modeled = rent used for gross potential rent (a vacant unit's asking rent). Pro forma = market rent for the Proforma page (blank = modeled).</p>
          <div className="grid2" style={{marginTop:10}}>
            <div className="field"><label>Rent roll date (for the intro)</label><input value={rentRollDate} onChange={e=>setRentRollDate(e.target.value)} placeholder="8/26"/></div>
          </div>
          <div className="field"><label style={{display:"flex",justifyContent:"space-between"}}><span>Rent roll intro paragraph (page 10)</span>{introEdited?<a href="#" onClick={e=>{e.preventDefault();setIntroEdited(false)}}>↺ back to automatic</a>:<span className="hint">automatic — edit to customize</span>}</label>
            <textarea rows={3} value={introText} onChange={e=>{setIntroEdited(true);setRentRollIntro(e.target.value)}}/></div>
        </div>

        <div className="section">
          <h3>Operating expenses</h3>
          <div className="grid3">
            <div className="field"><label>Vacancy & credit loss (%)</label><Num value={vacancyPct} onChange={setVacancyPct}/></div>
            <div className="field"><label>Other income ($/yr)</label><Num value={otherIncome} onChange={setOtherIncome}/></div>
            <div className="field"><label>Effective gross income</label><input disabled value={money(fin.cur.egi)}/></div>
          </div>
          <table className="fin-table"><thead><tr><th>Line item</th><th>Basis</th><th>Amount</th><th>Annual</th><th>% of EGI</th><th></th></tr></thead><tbody>
            {expenses.map((e,i)=>{const L=exLines[i];return <tr key={i}>
              <td><input value={e.label} onChange={ev=>updEx(i,"label",ev.target.value)} style={{minWidth:220}}/></td>
              <td><select value={e.basis} onChange={ev=>updEx(i,"basis",ev.target.value)} style={{width:128}}><option value="fixed">$ per year</option><option value="pctEGI">% of EGI</option><option value="perSF">$ per SF</option><option value="perUnit">$ per unit</option></select></td>
              <td><Num value={e.amount} onChange={v=>updEx(i,"amount",v)} style={{width:96}} placeholder={e.basis==="pctEGI"?"6":e.basis==="perSF"?"1.00":""}/></td>
              <td className="ro">{L?money(L.amount):"—"}</td>
              <td className="ro">{L&&fin.cur.egi?pctF(L.amount/fin.cur.egi):"—"}</td>
              <td><button className="remove-btn" onClick={()=>setExpenses(expenses.filter((_,j)=>j!==i))}>×</button></td>
            </tr>})}
            <tr className="tot"><td colSpan={3}>Total operating expenses</td><td>{money(fin.cur.total)}</td><td>{pctF(fin.cur.ratio)}</td><td/></tr>
          </tbody></table>
          <button className="add-row-btn" onClick={()=>setExpenses([...expenses,{label:"",basis:"fixed",amount:""}])}>+ Add expense</button>
          <div className="grid2" style={{marginTop:10}}>
            <div className="field"><label>Expense profile line (optional)</label><input value={expenseProfile} onChange={e=>setExpenseProfile(e.target.value)} placeholder={"Full rent roll, "+(omNum(vacancyPct)||5)+"% vacancy factor · "+(fin.units||"N")+" units · individually metered, tenant-paid utilities"}/></div>
            <div className="field"><label>Footnote (optional)</label><input value={opexFootnote} onChange={e=>setOpexFootnote(e.target.value)} placeholder="Water and power are separately metered and paid directly by the tenant at each unit."/></div>
          </div>
        </div>

        <div className="section">
          <h3>Market rent support (Proforma page, optional)</h3>
          <div className="field"><label>Source line</label><input value={market.source} onChange={e=>setMarket({...market,source:e.target.value})} placeholder="Rentometer, 1039 Marais St · 0.5 mile radius · trailing 12 months · 24 Sep 2026"/></div>
          <table className="fin-table"><thead><tr><th>Unit type</th><th>Sample</th><th>25th pct</th><th>Median</th><th>Average</th><th>75th pct</th><th>Pro forma applied</th><th></th></tr></thead><tbody>
            {market.rows.map((r,i)=><tr key={i}>{["unitType","sample","p25","median","avg","p75","applied"].map(k=><td key={k}><input value={r[k]??""} onChange={e=>{const rows=[...market.rows];rows[i]={...rows[i],[k]:e.target.value};setMarket({...market,rows})}} style={{width:k==="unitType"?120:72}}/></td>)}<td><button className="remove-btn" onClick={()=>setMarket({...market,rows:market.rows.filter((_,j)=>j!==i)})}>×</button></td></tr>)}
          </tbody></table>
          <button className="add-row-btn" onClick={()=>setMarket({...market,rows:[...market.rows,{unitType:"",sample:"",p25:"",median:"",avg:"",p75:"",applied:""}]})}>+ Add unit type</button>
        </div>

        <div className="section">
          <label className="check"><input type="checkbox" checked={includeCashFlow} onChange={e=>setIncludeCashFlow(e.target.checked)}/> Add a Cash Flow Analysis page (only when you have financing terms)</label>
          {includeCashFlow&&<div className="grid2" style={{marginTop:10}}>
            <table className="fin-table"><thead><tr><th>Line</th><th>Current</th><th>Pro forma</th></tr></thead><tbody>{cfItems.map((it,i)=><tr key={i}><td><input value={it.label} onChange={e=>{const n=[...cfItems];n[i]={...n[i],label:e.target.value};setCfItems(n)}}/></td><td><input value={it.current} onChange={e=>{const n=[...cfItems];n[i]={...n[i],current:e.target.value};setCfItems(n)}}/></td><td><input value={it.proforma} onChange={e=>{const n=[...cfItems];n[i]={...n[i],proforma:e.target.value};setCfItems(n)}}/></td></tr>)}</tbody></table>
            <table className="fin-table"><thead><tr><th>Financing term</th><th>Current</th><th>Pro forma</th></tr></thead><tbody>{cfTerms.map((t,i)=><tr key={i}><td><input value={t.label} onChange={e=>{const n=[...cfTerms];n[i]={...n[i],label:e.target.value};setCfTerms(n)}}/></td><td><input value={t.current} onChange={e=>{const n=[...cfTerms];n[i]={...n[i],current:e.target.value};setCfTerms(n)}}/></td><td><input value={t.proforma} onChange={e=>{const n=[...cfTerms];n[i]={...n[i],proforma:e.target.value};setCfTerms(n)}}/></td></tr>)}</tbody></table>
          </div>}
        </div>
        {nav(5,7,"Next: Generate →")}
      </div>}

      {/* STEP 7 — GENERATE */}
      {step===7&&<div>
        <h2>Generate Offering Memorandum</h2>
        <div className="card" style={{textAlign:"center",padding:32}}>
          <h3 style={{fontSize:18,marginBottom:6}}>{street||propertyName||"Untitled property"}</h3>
          <p className="hint" style={{marginBottom:4}}>{cityLine} · {unitDescription}</p>
          <p className="hint" style={{marginBottom:18}}>{agents.slice(0,3).map(a=>a.name).join(", ")||"no agents"} · {gridPhotos.length} photos · NOI {money(fin.cur.noi)} · {pctF(fin.inPlaceCap)} in-place cap</p>
          <p className="hint" style={{marginBottom:20}}>Pages: Cover, Property & Team, {includeAerial?"Aerial, ":""}Offering & Summary, {includeFloodMap?"Flood Map, ":""}{Math.ceil(gridPhotos.length/4)} photo page{Math.ceil(gridPhotos.length/4)===1?"":"s"}, Financial Overview, Current Rent Roll, Operating Expenses, Proforma Rent Roll, {includeCashFlow?"Cash Flow, ":""}Contact Details · 11 × 8.5 in</p>
          <button className="btn-green" style={{fontSize:16,padding:"14px 40px"}} onClick={handleGenerate} disabled={generating}>{generating?<><span className="spinner" style={{marginRight:8}}/>Building PPTX…</>:"⬇ Download OM (.pptx)"}</button>
          {genErrors&&genErrors.errors.length>0&&<div className="err-box"><b>Fix these before downloading:</b><ul>{genErrors.errors.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
          {genErrors&&genErrors.warnings.length>0&&<div className="warn-box" style={{textAlign:"left"}}><b>Heads up:</b><ul>{genErrors.warnings.map((x,i)=><li key={i}>{x}</li>)}</ul></div>}
          <p className="hint" style={{marginTop:12}}>Editable in PowerPoint, Google Slides or Keynote. Uses the Poppins font (free from Google Fonts) — install it on any computer that edits the file.</p>
          <div style={{marginTop:18,borderTop:"1px solid var(--border)",paddingTop:16}}>
            <button className="btn-dark" onClick={saveToCRM} disabled={saving||!selectedListingId}>{saving?<><span className="spinner" style={{marginRight:6}}/>Saving to CRM…</>:"Save this OM to CRM"}</button>
            <p className="hint" style={{marginTop:8}}>{selectedListingId?"Stores text, financials and photos on the listing so re-importing rebuilds this OM.":"Import a CRM listing first to enable saving."}</p>
          </div>
        </div>
        {nav(6,null)}
      </div>}
    </div>
    {toast&&<div className="toast">{toast}</div>}
  </>
}

ReactDOM.render(<App/>,document.getElementById("root"));

</script>
</body>
</html>
